# Лицензионная политика SRS 7.1: в бинарник — только пермиссивные лицензии.
[graph]
all-features = false

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "MPL-2.0", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "CDLA-Permissive-2.0", "0BSD"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
