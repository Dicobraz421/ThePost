# Пресет mailbox — узел ящиков профиля Enterprise-ВМ (SRS 1.2): N узлов под systemd за L4-балансировщиком.
# Обязательны три параметра (SRS 5.5); полный перечень секций: thepost config schema.

domain: example.ru

# Кластер PostgreSQL (эталон — pg_auto_failover, deploy/ansible/pg-ha.yml; SRS 3.1): узел сам находит primary —
# первый доступный для записи из url и urls (target_session_attrs=read-write), при переключении сбрасывает пул и
# повторяет идемпотентные операции (database.failover), дольше retry_for — временный отказ (SMTP 4xx).
# Учётные данные и параметры TLS — из url, из адресов urls — только хост, порт и БД.
# Узел — роль thepost (thepost_app); миграции — владелец схемы thepost_owner (DEP-08). Миграции подключаются только к
# url, без поиска primary: после переключения — meta.migrate_on_start: false или url — текущий primary.
database:
  url: postgres://thepost@pg1.example.ru:5432/thepost?sslmode=verify-full
  urls:
    - postgres://thepost@pg2.example.ru:5432/thepost
    - postgres://thepost@pg3.example.ru:5432/thepost
  failover: { retry_initial: 100ms, retry_max: 2s, retry_for: 30s, probe_timeout: 3s }
  password: { secret: "thepost/db#password" }
  owner:
    user: thepost_owner
    password: { secret: "thepost/db-owner#password" }
  # Через PgBouncer (transaction): url — PgBouncer, pgbouncer: true; слушатель сигналов и миграции — direct_url мимо
  # PgBouncer, один адрес (список urls к нему не применяется) — VIP или DNS, следующий за primary.
  #   url: postgres://thepost@pgbouncer.example.ru:6432/thepost?sslmode=verify-full
  #   pgbouncer: true
  #   direct_url: postgres://thepost@pg-primary.example.ru:5432/thepost?sslmode=verify-full

# S3 (эталон — SeaweedFS); ключи доступа — ссылки на секрет thepost/s3 в секции BLOB-хранилища.
blob:
  url: s3://thepost-blob

roles: [mailbox]

# Секреты — только из хранилища (OpenBao или Vault), канал — TLS; поля секции — по PLT-12.
secrets:
  url: https://openbao.example.ru:8200
  auth:
    approle:
      role_id_file: /etc/thepost/openbao/role_id
      secret_id_file: /run/credentials/thepost.service/openbao-secret-id
