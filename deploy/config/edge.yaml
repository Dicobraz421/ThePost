# Пресет edge — приём почты в DMZ: без доступа к БД, локальная очередь,
# реплика получателей из внутреннего контура (решение 2026-10-30, SRS 2.6).
# Полный перечень секций: thepost config schema.

domain: example.ru

# Локальная очередь и реплика получателей; database.url для edge не задаётся.
blob:
  url: file:///var/lib/thepost/edge

roles: [edge]
