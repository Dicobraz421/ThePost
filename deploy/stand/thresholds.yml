# Профили стенда SMB (APP-D Д.5, Д.6; решения 54–56 docs/decisions/2026-11-11-stage2-followups.md).
#   stand_common — при установке (--tags install), поверх эталона SMB (thepost_config_extra): квота ящика стенда и
#                  доверенный генератор нагрузки; свои добавки — stand_config_extra.
#   stand_profiles — перед прогоном (--tags run) поверх конфигурации узла, сохранённой при установке
#                  (/etc/thepost/config.stand-base.yaml): профиль -e stand_profile=<speed|thresholds>.
#     speed      — рабочие пороги эталона SMB, критерии скорости Д.7 (по умолчанию);
#     thresholds — пороги Д.5: механизмы, которые в эксплуатации срабатывают редко, срабатывают за время испытания;
#                  критерий — «узел не падает, отказы только 4xx, принятые письма не потеряны» (решение 54).
# Строки Д.5 без параметра в профиле SMB: HPA, PgBouncer, кэш moka/NVMe (только S3), HA СУБД, мигратор, перенос
# ящиков, балансировщик. «Rate limit: соединений с IP» (50 → 5) — ниже, секция ratelimit.
---
stand_profile: speed

stand_common:
  meta:
    retention:
      # Квота ящика стенда: 150 MB (решение 55; наполнение Д.3 — ≈ 110 MB на ящик). Д.5 (50 GB → 50 MB) меньше
      # наполнения — на стенде не применяется.
      quota_bytes: 157286400
  # Генератор нагрузки — доверенный на время замеров (решение 56). Списка доверенных адресов в узле нет, поэтому
  # ограничение частоты (ratelimit: адрес, подсеть, учётная запись) на стенде выключено (burst: 0): вся нагрузка идёт
  # с одного адреса генератора (1 000 пользователей — ≈ 5 соединений SMTP/с), лимит по адресу блокировал его на
  # block_duration. Защита от перебора (auth.abuse: неудачные входы) включена — её проверяет сценарий bruteforce со
  # второго адреса (stand_bruteforce_source); генератор входит верными паролями и под неё не попадает.
  ratelimit:
    ip: { burst: 0, per_minute: 0 }
    subnet_v4: { burst: 0, per_minute: 0 }
    subnet_v6: { burst: 0, per_minute: 0 }
    account: { burst: 0, per_minute: 0 }

stand_profiles:
  # Рабочие пороги — конфигурация установки без изменений.
  speed: {}
  # Пороги Д.5.
  thresholds:
    meta:
      # Срок хранения корзины: 30 сут → 15 мин.
      retention:
        trash_retention: 15m
      # Период ожидания GC (надгробие BLOB, поколения объектов): 24 ч → 5 мин.
      blob_tombstone_ttl: 5m
    blob:
      gc:
        # Окно W: ≥ окна PITR → 30 мин.
        window: 30m
      orphans:
        # Интервал поиска «сирот»: → 2 мин; период ожидания — меньше длительности испытания.
        interval: 2m
        grace: 5m
    database:
      # Пул соединений узла: 20 → 3.
      max_connections: 3
    search:
      indexer:
        # Интервал коммита индекса: → 5 с.
        commit_interval: 5s
      cache:
        # Кэш индексов на узле: → 1 GB.
        max_bytes: 1073741824
    smtp:
      queue:
        # Повторы очереди SMTP: 15 мин … 5 сут → 1 мин … 30 мин.
        retry: [1m, 2m, 5m, 10m, 30m]
        expire: 30m
        delay_notify: 10m
