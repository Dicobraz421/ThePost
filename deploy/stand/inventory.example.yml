# Пример инвентаря стенда SMB (APP-D Д.2): узел SMB и генератор нагрузки (Debian 12 / Ubuntu 24.04).
#   ansible-playbook -i inventory.yml deploy/stand/stand.yml                       # установка + базовый сценарий
#   ansible-playbook -i inventory.yml deploy/stand/stand.yml -e stand_scenario=peak
#   ansible-playbook -i inventory.yml deploy/stand/stand.yml --tags provision,fill            # учётные записи, наполнение
#   ansible-playbook -i inventory.yml deploy/stand/stand.yml --tags run -e stand_scenario=stress
# Узел внешних интеграций (Rspamd + clamav-milter, FreeIPA) — в профиле SMB Rspamd и clamav-milter на узле SMB
# (эталон); учётные записи — stand_provision (по умолчанию admin: thepost admin на узле SMB, пароль приложения
# у каждой свой; roles/stand_generator/defaults/main.yml).
---
all:
  children:
    smb:
      hosts:
        smb.stand.test:
          ansible_host: 192.0.2.10
      vars:
        thepost_domain: stand.test
        thepost_hostname: mail.stand.test
        thepost_tls_mode: internal
        thepost_clamav: true
    generator:
      hosts:
        gen.stand.test:
          ansible_host: 192.0.2.20
  vars:
    ansible_user: admin
    stand_users: 1000
    # stand_provision: none или ldif (каталог LDAP / FreeIPA) — общий пароль stand_user_password в ansible-vault.
