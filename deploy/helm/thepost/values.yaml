# Узел The Post в Kubernetes:
#   helm install thepost deploy/helm/thepost -n thepost --create-namespace -f <свои значения>
# До установки — OpenBao (deploy/helm/openbao, bootstrap.sh: Kubernetes auth для сервисного аккаунта thepost),
# секрет TLS клиентских протоколов (values.tls.secretName: tls.crt, tls.key; ca.crt — CA внутренних каналов).

image:
  repository: thepost
  tag: ""          # пусто — appVersion чарта
  pullPolicy: IfNotPresent

replicaCount: 1

# Сервисный аккаунт — вход в OpenBao через Kubernetes auth (роль thepost, bootstrap.sh): токен монтируется в под.
serviceAccount:
  create: true
  name: thepost

tls:
  secretName: thepost-tls

# Минимальные привилегии (SRS 2.7, 6.8): не root, корневая ФС только для чтения, без повышения привилегий и без
# capabilities; seccomp — RuntimeDefault и свой профиль ролей процесса (секция confine config.yaml). Свой
# профиль узла (Localhost) — containerSecurityContext.seccompProfile: { type: Localhost, localhostProfile: … }.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# Порты контейнера — выше 1024 (привязка без capabilities); стандартные порты — у Service.
ports:
  smtp: { container: 2525, service: 25 }
  submissions: { container: 4465, service: 465 }
  submission: { container: 5587, service: 587 }
  imap: { container: 1143, service: 143 }
  imaps: { container: 1993, service: 993 }
  https: { container: 4443, service: 443 }

service:
  type: LoadBalancer
  annotations: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# PostgreSQL — CloudNativePG (эталон Enterprise-K8s, SRS 3.1; решение 2026-11-01 «Требования к СУБД»): Cluster
# (primary + синхронные реплики, RPO = 0, переключение оператором, RTO ≤ 30 с) и Pooler (PgBouncer, transaction).
# Оператор CloudNativePG 1.26+ (synchronous.dataDurability) и его CRD — отдельно, до чарта:
#   helm repo add cnpg https://cloudnative-pg.github.io/charts
#   helm install cnpg cnpg/cloudnative-pg -n cnpg-system --create-namespace
# С enabled: true адреса config.database (url, pgbouncer, direct_url) задаёт чарт: служба primary <выпуск>-db-rw
# (единый адрес, список urls не нужен) и Pooler <выпуск>-db-pooler-rw; CA сервера — секрет <выпуск>-db-ca
# (в под — только ca.crt). Секреты паролей (kubernetes.io/basic-auth: username, password) создаются до установки —
# с теми же паролями, что в OpenBao: owner — thepost_owner (thepost/db-owner), app — thepost (thepost/db),
# readonly — thepost_readonly (thepost/db-readonly).
cnpg:
  enabled: false
  instances: 3            # primary + 2 реплики: два кандидата в синхронные (SRS 3.1)
  # Образ без интерпретаторов (SRS 7.1): minimal — без barman-cloud (Python); резервные копии — отдельным средством.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.9-minimal-bookworm
  database: thepost
  # Режим сохранности (решение владельца #272) → synchronous.dataDurability оператора:
  #   required  — RPO = 0 всегда: без синхронной реплики фиксация ждёт её возврата (запись стоит, чтение работает);
  #   preferred — доступность важнее: пока реплика есть — синхронно, без реплик оператор снимает синхронность и
  #               запись идёт асинхронно (отказ primary в это время теряет последние фиксации).
  db_durability: required
  # Синхронная репликация: фиксация ждёт одну из реплик (ANY 1); dataDurability задаёт db_durability.
  synchronous:
    method: any
    number: 1
  failoverDelay: 0        # с: переключение сразу после отказа primary
  switchoverDelay: 30     # с: остановка primary при плановом переключении
  parameters: {}          # postgresql.conf (shared_buffers и т. п.)
  storage:
    size: 500Gi
    storageClass: ""
  resources: {}
  # Свои сертификаты сервера (cert-manager и т. п.): serverCASecret, serverTLSSecret; пусто — CA оператора.
  certificates: {}
  secrets:
    owner: thepost-db-owner
    app: thepost-db
    readonly: thepost-db-readonly
  pooler:
    enabled: true
    instances: 2
    parameters:
      max_client_conn: "1000"
      default_pool_size: "20"
      max_prepared_statements: "200"

# config.yaml узла (SRS 5.5; полный перечень — thepost config schema). Слушатели — на портах ports.*.container.
# Admin API — только loopback пода (SRS 6.8; доступ — kubectl port-forward), в Service не входит.
# Служебный HTTP (/healthz, /metrics) — на адресе пода для проб kubelet: 0.0.0.0 явно разрешён internal_networks.
config:
  domain: example.ru
  roles: [mailbox]
  database:
    # Внешний кластер: единый адрес (VIP, DNS, Service) или url + urls (поиск primary); с cnpg.enabled — задаёт чарт.
    url: postgres://thepost@postgres.example.ru:5432/thepost?sslmode=verify-full&sslrootcert=/etc/thepost/tls/ca.crt
    failover: { retry_initial: 100ms, retry_max: 2s, retry_for: 30s, probe_timeout: 3s }
    password: { secret: "thepost/db#password" }
    # Миграции — от владельца схемы (DEP-08); узел входит ролью thepost (thepost_app).
    owner:
      user: thepost_owner
      password: { secret: "thepost/db-owner#password" }
  blob:
    url: s3://thepost-blob
  tls:
    cert_file: /etc/thepost/tls/tls.crt
    key_file: /etc/thepost/tls/tls.key
  service_http:
    listen: "0.0.0.0:8081"
    internal_networks: ["0.0.0.0/32"]
  http:
    jmap: { listen: "0.0.0.0:4443" }
    admin: { listen: "127.0.0.1:8443" }
  imap:
    listeners:
      - listen: "0.0.0.0:1143"
      - listen: "0.0.0.0:1993"
        implicit_tls: true
  smtp:
    hostname: mail.example.ru
    inbound:
      - listen: "0.0.0.0:2525"
    submission:
      - listen: "0.0.0.0:5587"
      - listen: "0.0.0.0:4465"
        implicit_tls: true
  secrets:
    url: https://openbao.openbao.svc:8200
    tls:
      ca_file: /etc/thepost/tls/ca.crt
    auth:
      kubernetes:
        role: thepost
