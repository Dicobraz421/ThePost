# Узел The Post в Kubernetes:
#   helm install thepost deploy/helm/thepost -n thepost --create-namespace -f <свои значения>
# До установки — OpenBao (deploy/helm/openbao, bootstrap.sh: Kubernetes auth для сервисного аккаунта thepost),
# секрет с цепочкой TLS клиентских протоколов (values.tls.secretName: tls.crt; ca.crt — CA внутренних каналов) и ключ TLS
# в OpenBao (секрет thepost/tls#key — bootstrap.sh с TLS_KEY; в под монтируются только tls.crt и ca.crt).

# Образ узла — ghcr.io (выпуски beta.yml, linux/amd64; теги beta-<дата> и beta), подписан cosign без ключей:
#   cosign verify ghcr.io/dicobraz421/thepost:<тег> \
#     --certificate-identity 'https://github.com/Dicobraz421/ThePost/.github/workflows/beta.yml@refs/heads/main' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# Закрепить проверенный образ — tag с digest из описания выпуска: "beta-20261112@sha256:…". Свой реестр (зеркало,
# закрытый контур) — repository: <реестр>/thepost (тот же digest после копирования, например crane copy или skopeo
# copy с подписью: cosign copy); реестр с входом — imagePullSecrets.
image:
  repository: ghcr.io/dicobraz421/thepost
  # Пусто — appVersion чарта (тег выпуска с версией); до первого такого выпуска — tag: beta-<дата> из выпуска.
  tag: ""
  pullPolicy: IfNotPresent
# Секреты docker-registry для входа в реестр образа (имена в пространстве имён релиза), например [{ name: ghcr }].
imagePullSecrets: []

replicaCount: 1

# Сервисный аккаунт — вход в OpenBao через Kubernetes auth (роль thepost, bootstrap.sh): токен монтируется в под.
serviceAccount:
  create: true
  name: thepost

tls:
  secretName: thepost-tls

# Минимальные привилегии (SRS 2.7, 6.8): не root, корневая ФС только для чтения, без повышения привилегий и без
# capabilities; seccomp — RuntimeDefault и свой профиль ролей процесса (секция confine config.yaml). Свой
# профиль узла (Localhost) — containerSecurityContext.seccompProfile: { type: Localhost, localhostProfile: … }.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# Порты контейнера — выше 1024 (привязка без capabilities); стандартные порты — у Service.
ports:
  smtp: { container: 2525, service: 25 }
  submissions: { container: 4465, service: 465 }
  submission: { container: 5587, service: 587 }
  imap: { container: 1143, service: 143 }
  imaps: { container: 1993, service: 993 }
  managesieve: { container: 4190, service: 4190 }
  https: { container: 4443, service: 443 }

service:
  type: LoadBalancer
  annotations: {}

# Память — requests и limits (кэши занимают её до лимита, SRS 2.7); размеры — по рекомендациям VPA (vpa.enabled).
# HPA по CPU считает загрузку от requests.cpu: с autoscaling.enabled он обязателен. Пример:
#   resources: { requests: { cpu: "1", memory: 4Gi }, limits: { memory: 4Gi } }
resources: {}
nodeSelector: {}
tolerations: []
# Своё affinity заменяет anti-affinity по узлам (podAntiAffinity).
affinity: {}
# Anti-affinity подов по узлам кластера (SRS 2.3, приложение З.4) при пустом affinity: soft — по возможности на разных
# узлах (preferred), hard — только на разных (required: подов не больше, чем узлов), "" — без правила.
podAntiAffinity: soft

# Масштабирование Enterprise-K8s (SRS 2.3, приложение З.4; решение 2026-11-01): HPA по загрузке CPU; по числу
# соединений (tp_load_connections) — по выбору заказчика, через prometheus-adapter
# (deploy/helm/prometheus-adapter/values-thepost.yaml). HPA по памяти не используется: память занята кэшами до
# лимита и после пика не освобождается. С enabled: true число подов задаёт HPA (replicaCount не применяется).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  cpu:
    targetUtilization: 70          # % от resources.requests.cpu
  # Среднее число открытых соединений на под (метрика Pods через custom.metrics.k8s.io): нужен prometheus-adapter
  # с правилом для tp_load_connections и сбор /metrics подов (metrics.podMonitor). Целевое значение — ориентир,
  # уточняется на стенде (приложение Д).
  connections:
    enabled: false
    metric: tp_load_connections
    targetAverageValue: "1000"
  # Рост — сразу; сжатие — после окна стабилизации и по одному поду: колебания нагрузки не рвут долгоживущие
  # соединения (IMAP IDLE, JMAP push).
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - { type: Pods, value: 2, periodSeconds: 60 }
        - { type: Percent, value: 50, periodSeconds: 60 }
    scaleDown:
      stabilizationWindowSeconds: 1800   # 30 мин
      selectPolicy: Min
      policies:
        - { type: Pods, value: 1, periodSeconds: 600 }

# PodDisruptionBudget (SRS 2.3): при плановых работах на узлах кластера (drain) недоступно не больше maxUnavailable
# подов. Создаётся при двух и более подах (replicaCount или autoscaling.minReplicas): с одним подом бюджет
# запретил бы drain.
pdb:
  enabled: true
  maxUnavailable: 1

# VPA — только рекомендации requests и limits (updateMode Off; автоматическое применение не используется,
# приложение З.4): kubectl describe vpa <выпуск>. Нужен Vertical Pod Autoscaler (CRD autoscaling.k8s.io/v1) в кластере.
vpa:
  enabled: false
  controlledResources: [cpu, memory]
  controlledValues: RequestsAndLimits
  minAllowed: {}                   # { cpu: 500m, memory: 1Gi }
  maxAllowed: {}                   # { cpu: "8", memory: 32Gi }

# Сбор /metrics подов Prometheus Operator (PodMonitor, CRD monitoring.coreos.com/v1) — для HPA по соединениям.
# Канал — HTTPS служебного HTTP пода (порт service-http) с проверкой по CA внутренних каналов (ключ ca.crt секрета
# tls.secretName в пространстве имён выпуска).
metrics:
  podMonitor:
    enabled: false
    interval: 30s
    labels: {}
    serverName: ""                 # имя в сертификате пода (tls.secretName); пусто — проверка по адресу пода

# PostgreSQL — CloudNativePG (эталон Enterprise-K8s, SRS 3.1; решение 2026-11-01 «Требования к СУБД»): Cluster
# (primary + синхронные реплики, RPO = 0, переключение оператором, RTO ≤ 30 с) и Pooler (PgBouncer, transaction).
# Оператор CloudNativePG 1.26+ (synchronous.dataDurability) и его CRD — отдельно, до чарта:
#   helm repo add cnpg https://cloudnative-pg.github.io/charts
#   helm install cnpg cnpg/cloudnative-pg -n cnpg-system --create-namespace
# С enabled: true адреса config.database (url, pgbouncer, direct_url) задаёт чарт: служба primary <выпуск>-db-rw
# (единый адрес, список urls не нужен) и Pooler <выпуск>-db-pooler-rw; CA сервера — секрет <выпуск>-db-ca
# (в под — только ca.crt). Секреты паролей (kubernetes.io/basic-auth: username, password) создаются до установки —
# с теми же паролями, что в OpenBao: owner — thepost_owner (thepost/db-owner), app — thepost (thepost/db),
# readonly — thepost_readonly (thepost/db-readonly).
cnpg:
  enabled: false
  instances: 3            # primary + 2 реплики: два кандидата в синхронные (SRS 3.1)
  # Образ без интерпретаторов (SRS 7.1): minimal — без barman-cloud (Python); резервные копии — отдельным средством.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.9-minimal-bookworm
  database: thepost
  # Режим сохранности (решение владельца #272) → synchronous.dataDurability оператора:
  #   required  — RPO = 0 всегда: без синхронной реплики фиксация ждёт её возврата (запись стоит, чтение работает);
  #   preferred — доступность важнее: пока реплика есть — синхронно, без реплик оператор снимает синхронность и
  #               запись идёт асинхронно (отказ primary в это время теряет последние фиксации).
  db_durability: required
  # Синхронная репликация: фиксация ждёт одну из реплик (ANY 1); dataDurability задаёт db_durability.
  synchronous:
    method: any
    number: 1
  failoverDelay: 0        # с: переключение сразу после отказа primary
  switchoverDelay: 30     # с: остановка primary при плановом переключении
  parameters: {}          # postgresql.conf (shared_buffers и т. п.)
  storage:
    size: 500Gi
    storageClass: ""
  resources: {}
  # Свои сертификаты сервера (cert-manager и т. п.): serverCASecret, serverTLSSecret; пусто — CA оператора.
  certificates: {}
  secrets:
    owner: thepost-db-owner
    app: thepost-db
    readonly: thepost-db-readonly
  pooler:
    enabled: true
    instances: 2
    parameters:
      max_client_conn: "1000"
      default_pool_size: "20"
      max_prepared_statements: "200"

# config.yaml узла (SRS 5.5; полный перечень — thepost config schema). Слушатели — на портах ports.*.container.
# Admin API — только loopback пода (SRS 6.8; доступ — kubectl port-forward), в Service не входит.
# Служебный HTTP (/healthz, /metrics) — на адресе пода для проб kubelet: 0.0.0.0 явно разрешён internal_networks.
config:
  domain: example.ru
  roles: [mailbox]
  database:
    # Внешний кластер: единый адрес (VIP, DNS, Service) или url + urls (поиск primary); с cnpg.enabled — задаёт чарт.
    url: postgres://thepost@postgres.example.ru:5432/thepost?sslmode=verify-full&sslrootcert=/etc/thepost/tls/ca.crt
    failover: { retry_initial: 100ms, retry_max: 2s, retry_for: 30s, probe_timeout: 3s }
    password: { secret: "thepost/db#password" }
    # Миграции — от владельца схемы (DEP-08); узел входит ролью thepost (thepost_app).
    owner:
      user: thepost_owner
      password: { secret: "thepost/db-owner#password" }
  blob:
    url: s3://thepost-blob
  tls:
    cert_file: /etc/thepost/tls/tls.crt
    # Ключ — только из OpenBao (решение 100); новая версия секрета подхватывается без перезапуска.
    key: { secret: "thepost/tls#key" }
  service_http:
    listen: "0.0.0.0:8081"
    internal_networks: ["0.0.0.0/32"]
  # Календари и контакты (роль dav: /dav/, /.well-known/caldav и carddav) — на слушателе jmap, один порт с JMAP;
  # отдельный адрес — http.dav (и порт в ports, Service).
  http:
    jmap: { listen: "0.0.0.0:4443" }
    admin: { listen: "127.0.0.1:8443" }
  # Роль maintenance: очистка по сроку (надгробия DAV, журналы автоответов и доставки, токены admin init);
  # сроки хранения — meta. Проверку BLOB в кластере выполняет один под — держатель лизы verify.lease_name.
  maintenance:
    purge_interval: 1h
    admin_token_retention: 30d
    verify: { at: "03:00", interval: 24h }
  meta:
    dav: { tombstone_ttl: 90d }
    sieve: { vacation_log_ttl: 90d }
    delivery: { retention: 30d }
  # Лимиты CalDAV и CardDAV; полный перечень — thepost config schema.
  dav:
    max_request_size: 1048576
    max_object_size: 1048576
  imap:
    listeners:
      - listen: "0.0.0.0:1143"
      - listen: "0.0.0.0:1993"
        implicit_tls: true
  sieve:
    managesieve:
      listen:
        - listen: "0.0.0.0:4190"
  smtp:
    hostname: mail.example.ru
    inbound:
      - listen: "0.0.0.0:2525"
    submission:
      - listen: "0.0.0.0:5587"
      - listen: "0.0.0.0:4465"
        implicit_tls: true
  secrets:
    url: https://openbao.openbao.svc:8200
    tls:
      ca_file: /etc/thepost/tls/ca.crt
    auth:
      kubernetes:
        role: thepost
