apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "thepost.fullname" . }}
  labels:
    {{- include "thepost.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "thepost.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "thepost.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "thepost.config" . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # Токен сервисного аккаунта — вход в OpenBao (secrets.auth.kubernetes.jwt_file).
      automountServiceAccountToken: true
      imagePullSecrets:
        {{- include "thepost.imagePullSecrets" . | nindent 8 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: thepost
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/thepost/config.yaml"]
          {{- if .Values.gssapi.keytabSecret }}
          # Keytab Kerberos: MIT Kerberos читает его только из KRB5_KTNAME (auth.gssapi.keytab сверяется с ней).
          env:
            - name: KRB5_KTNAME
              value: "FILE:{{ include "thepost.keytab" . }}"
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            {{- range $name, $p := .Values.ports }}
            - name: {{ $name }}
              containerPort: {{ $p.container }}
              protocol: TCP
            {{- end }}
            - name: service-http
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz/live, port: service-http, scheme: HTTPS }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz/ready, port: service-http, scheme: HTTPS }
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: config, mountPath: /etc/thepost/config.yaml, subPath: config.yaml, readOnly: true }
            - { name: tls, mountPath: /etc/thepost/tls, readOnly: true }
            {{- if .Values.gssapi.keytabSecret }}
            - { name: keytab, mountPath: {{ include "thepost.keytab" . | dir }}, readOnly: true }
            {{- end }}
            {{- if .Values.cnpg.enabled }}
            # CA сервера PostgreSQL (CloudNativePG): sslmode=verify-full.
            - { name: db-ca, mountPath: /etc/thepost/db-ca, readOnly: true }
            {{- end }}
            # Запись — только каталог данных узла (кэш, при file:// — BLOB) и /tmp в памяти.
            - { name: state, mountPath: /var/lib/thepost }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: {{ include "thepost.fullname" . }}-config
        # Цепочка и CA; ключ TLS — в OpenBao, в под не попадает (решение 100).
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
            items:
              - { key: tls.crt, path: tls.crt }
              - { key: ca.crt, path: ca.crt }
        {{- if .Values.gssapi.keytabSecret }}
        - name: keytab
          secret:
            secretName: {{ .Values.gssapi.keytabSecret }}
            defaultMode: 0440
            items:
              - { key: keytab, path: {{ include "thepost.keytab" . | base }} }
        {{- end }}
        {{- if .Values.cnpg.enabled }}
        # Только сертификат CA (ключ CA в под не попадает).
        - name: db-ca
          secret:
            secretName: {{ include "thepost.dbCASecret" . }}
            items:
              - { key: ca.crt, path: ca.crt }
        {{- end }}
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if .Values.podAntiAffinity }}
      # Поды — на разных узлах кластера (podAntiAffinity: {{ .Values.podAntiAffinity }}).
      affinity:
        podAntiAffinity:
          {{- if eq .Values.podAntiAffinity "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "thepost.selectorLabels" . | nindent 18 }}
          {{- else if eq .Values.podAntiAffinity "soft" }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "thepost.selectorLabels" . | nindent 20 }}
          {{- else }}
          {{- fail "podAntiAffinity: soft, hard или пусто" }}
          {{- end }}
      {{- end }}
