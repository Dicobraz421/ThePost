# Роль postgresql: одиночный PostgreSQL профиля SMB (SRS 1.2) — пакеты PGDG, только TLS по сети, раздельные
# учётные записи (SRS 2.7, 3.1; META-23, DEP-08; как compose/postgres/app-role.sh): владелец схемы, узел, только чтение.
---
# PostgreSQL 16+ (SRS). Семейство ОС — по менеджеру пакетов: apt — Debian, Ubuntu, Astra Linux SE; dnf — РЕД ОС,
# AlmaLinux, RHEL (решения 2026-11-11 №28, 51, 52).
postgresql_version: 16
postgresql_rhel: "{{ ansible_pkg_mgr != 'apt' }}"
# Пакеты PGDG (в Debian 12 и Astra Linux SE 1.8 только 15): apt.postgresql.org или download.postgresql.org (yum,
# AlmaLinux, RHEL). РЕД ОС — пакеты postgresqlNN дистрибутива (PGDG для РЕД ОС нет).
postgresql_pgdg_repo: "{{ ansible_distribution != 'RED' }}"
postgresql_pgdg_uri: http://apt.postgresql.org/pub/repos/apt
# Набор apt — кодовое имя выпуска; у Astra Linux SE 1.8 своё имя, набор — bookworm (база Debian 12).
postgresql_pgdg_suite: >-
  {{ 'bookworm' if ansible_distribution is match('Astra') else ansible_distribution_release }}-pgdg
postgresql_pgdg_key_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
# Astra Linux SE закрепляет свои репозитории (Pin-Priority 900, astra.pin.pref) — свои postgresql-common и libpq5
# (15) не дают поставить PGDG 16; true — пакеты PGDG получают приоритет 901 (thepost-pgdg.pref).
postgresql_pgdg_pin: "{{ ansible_distribution is match('Astra') }}"
postgresql_pgdg_yum_uri: https://download.postgresql.org/pub/repos/yum
postgresql_pgdg_yum_key_url: https://download.postgresql.org/pub/repos/yum/keys/PGDG-RPM-GPG-KEY-RHEL
postgresql_cluster: main
# Раскладка пакетов: Debian — /etc/postgresql/<версия>/<кластер>, юнит postgresql@<версия>-<кластер>; семейство RHEL
# (PGDG и РЕД ОС) — настройки в каталоге данных /var/lib/pgsql/<версия>/data, юнит postgresql-<версия>.
postgresql_data_dir: >-
  {{ '/var/lib/pgsql/' ~ postgresql_version ~ '/data' if postgresql_rhel | bool
     else '/var/lib/postgresql/' ~ postgresql_version ~ '/' ~ postgresql_cluster }}
postgresql_conf_dir: >-
  {{ postgresql_data_dir if postgresql_rhel | bool
     else '/etc/postgresql/' ~ postgresql_version ~ '/' ~ postgresql_cluster }}
postgresql_bin_dir: >-
  {{ '/usr/pgsql-' ~ postgresql_version ~ '/bin' if postgresql_rhel | bool
     else '/usr/lib/postgresql/' ~ postgresql_version ~ '/bin' }}
postgresql_home: "{{ '/var/lib/pgsql' if postgresql_rhel | bool else '/var/lib/postgresql' }}"
# Создание кластера семейства RHEL: PGDG — <bin>/postgresql-<версия>-setup, РЕД ОС — /usr/bin/postgresql-<версия>-setup.
postgresql_setup_cmd: >-
  {{ ('/usr/bin' if ansible_distribution == 'RED' else postgresql_bin_dir) ~ '/postgresql-' ~ postgresql_version ~ '-setup' }}
# Юнит кластера (drop-in роли pgbackrest) и служба для запуска и перезапуска.
postgresql_unit: >-
  {{ 'postgresql-' ~ postgresql_version if postgresql_rhel | bool
     else 'postgresql@' ~ postgresql_version ~ '-' ~ postgresql_cluster }}.service
postgresql_service: "{{ 'postgresql-' ~ postgresql_version if postgresql_rhel | bool else 'postgresql' }}"

# Только локальные подключения: thepost на той же ВМ.
postgresql_listen_addresses: localhost
postgresql_port: 5432
# Сертификат сервера: по умолчанию — внутренний CA роли thepost_pki (на ВМ).
postgresql_tls_cert_src: "{{ thepost_pki_dir | default('/etc/thepost/pki') }}/internal.pem"
postgresql_tls_key_src: "{{ thepost_pki_dir | default('/etc/thepost/pki') }}/internal.key"
# Дополнительные параметры postgresql.conf (имя → значение), например shared_buffers.
postgresql_settings: {}

# Учётные записи (все — без SUPERUSER, BYPASSRLS, CREATEDB, CREATEROLE, REPLICATION); пароли — из OpenBao
# (роль openbao выставляет thepost_db_password, thepost_db_owner_password, thepost_db_readonly_password):
#   postgresql_owner_role    — владелец БД и схемы public: только миграции (database.owner в config.yaml);
#   postgresql_app_role      — вход узла thepost (database.url), член thepost_app: DML без владения таблицами;
#   postgresql_readonly_role — только чтение метаданных (отчёты, проверки, роли search/indexer), член thepost_reader.
postgresql_owner_role: thepost_owner
postgresql_app_role: thepost
postgresql_readonly_role: thepost_readonly
postgresql_app_db: thepost
# Языковая настройка новой БД (решение 2026-11-11 №23): UTF8 и LC_CTYPE UTF-8 — иначе lower() не переводит кириллицу
# в именах входа. Уже созданная БД не пересоздаётся: при другой настройке роль останавливается с ошибкой.
postgresql_app_db_encoding: UTF8
postgresql_app_db_locale: C.UTF-8
postgresql_app_networks: ["127.0.0.1/32", "::1/128"]
# Групповые роли без входа: права на таблицы выдаёт миграция (tp_grant_roles, crates/tp-meta/migrations/0012);
# имена заданы миграцией — не менять.
postgresql_app_group: thepost_app
postgresql_reader_group: thepost_reader
# on_create — пароль задаётся при создании роли (повторный прогон без изменений); always — выставлять каждый раз.
postgresql_update_password: on_create
