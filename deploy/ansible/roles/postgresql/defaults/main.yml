# Роль postgresql: одиночный PostgreSQL профиля SMB (SRS 1.2) — пакеты PGDG, только TLS по сети, раздельные
# учётные записи (SRS 2.7, 3.1; META-23, DEP-08; как compose/postgres/app-role.sh): владелец схемы, узел, только чтение.
---
# PostgreSQL 16+ (SRS); пакеты — репозиторий PGDG (apt.postgresql.org): в Debian 12 только 15.
postgresql_version: 16
postgresql_pgdg_repo: true
postgresql_pgdg_uri: http://apt.postgresql.org/pub/repos/apt
postgresql_pgdg_key_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
postgresql_cluster: main
postgresql_conf_dir: "/etc/postgresql/{{ postgresql_version }}/{{ postgresql_cluster }}"
postgresql_data_dir: "/var/lib/postgresql/{{ postgresql_version }}/{{ postgresql_cluster }}"
postgresql_bin_dir: "/usr/lib/postgresql/{{ postgresql_version }}/bin"
postgresql_service: postgresql

# Только локальные подключения: thepost на той же ВМ.
postgresql_listen_addresses: localhost
postgresql_port: 5432
# Сертификат сервера: по умолчанию — внутренний CA роли thepost_pki (на ВМ).
postgresql_tls_cert_src: "{{ thepost_pki_dir | default('/etc/thepost/pki') }}/internal.pem"
postgresql_tls_key_src: "{{ thepost_pki_dir | default('/etc/thepost/pki') }}/internal.key"
# Дополнительные параметры postgresql.conf (имя → значение), например shared_buffers.
postgresql_settings: {}

# Учётные записи (все — без SUPERUSER, BYPASSRLS, CREATEDB, CREATEROLE, REPLICATION); пароли — из OpenBao
# (роль openbao выставляет thepost_db_password, thepost_db_owner_password, thepost_db_readonly_password):
#   postgresql_owner_role    — владелец БД и схемы public: только миграции (database.owner в config.yaml);
#   postgresql_app_role      — вход узла thepost (database.url), член thepost_app: DML без владения таблицами;
#   postgresql_readonly_role — только чтение метаданных (отчёты, проверки, роли search/indexer), член thepost_reader.
postgresql_owner_role: thepost_owner
postgresql_app_role: thepost
postgresql_readonly_role: thepost_readonly
postgresql_app_db: thepost
postgresql_app_networks: ["127.0.0.1/32", "::1/128"]
# Групповые роли без входа: права на таблицы выдаёт миграция (tp_grant_roles, crates/tp-meta/migrations/0012);
# имена заданы миграцией — не менять.
postgresql_app_group: thepost_app
postgresql_reader_group: thepost_reader
# on_create — пароль задаётся при создании роли (повторный прогон без изменений); always — выставлять каждый раз.
postgresql_update_password: on_create
