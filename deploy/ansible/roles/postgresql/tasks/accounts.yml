# Учётные записи и БД The Post (SRS 2.7, 3.1; META-23, DEP-08) на primary. Общие для эталона SMB (main.yml) и
# эталона Enterprise-ВМ (роль pg_auto_failover: include_role tasks_from: accounts). Повторный прогон ничего не меняет.
---
# Групповые роли без входа: права на таблицы им выдаёт миграция (tp_grant_roles), владельцу схемы CREATEROLE не нужен.
- name: Create group roles
  community.postgresql.postgresql_user:
    name: "{{ item }}"
    role_attr_flags: NOLOGIN,NOSUPERUSER,NOBYPASSRLS,NOCREATEDB,NOCREATEROLE,NOREPLICATION
    port: "{{ postgresql_port }}"
  loop:
    - "{{ postgresql_app_group }}"
    - "{{ postgresql_reader_group }}"
  register: postgresql_groups
  become: true
  become_user: postgres

# Пароль задаётся при создании роли: повторный прогон его не сравнивает (SCRAM). Смена пароля — в OpenBao и
# ALTER ROLE вручную или postgresql_update_password: always (прогон станет «changed»).
- name: Create login roles
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOBYPASSRLS,NOCREATEDB,NOCREATEROLE,NOREPLICATION
    update_password: "{{ postgresql_update_password }}"
    port: "{{ postgresql_port }}"
  loop:
    - { name: "{{ postgresql_owner_role }}", password: "{{ thepost_db_owner_password }}" }
    - { name: "{{ postgresql_app_role }}", password: "{{ thepost_db_password }}" }
    - { name: "{{ postgresql_readonly_role }}", password: "{{ thepost_db_readonly_password }}" }
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: postgres
  no_log: true

- name: Grant group roles
  community.postgresql.postgresql_membership:
    groups: ["{{ item.group }}"]
    target_roles: ["{{ item.role }}"]
    state: present
    port: "{{ postgresql_port }}"
  loop:
    - { group: "{{ postgresql_app_group }}", role: "{{ postgresql_app_role }}" }
    - { group: "{{ postgresql_reader_group }}", role: "{{ postgresql_readonly_role }}" }
  register: postgresql_memberships
  become: true
  become_user: postgres

# Владелец БД — владелец схемы public (PostgreSQL 15+: pg_database_owner): миграции создают в ней таблицы.
- name: Create database thepost
  community.postgresql.postgresql_db:
    name: "{{ postgresql_app_db }}"
    owner: "{{ postgresql_owner_role }}"
    port: "{{ postgresql_port }}"
  become: true
  become_user: postgres

- name: Revoke database access from PUBLIC
  community.postgresql.postgresql_privs:
    db: "{{ postgresql_app_db }}"
    type: database
    objs: "{{ postgresql_app_db }}"
    roles: PUBLIC
    privs: ALL
    state: absent
    port: "{{ postgresql_port }}"
  become: true
  become_user: postgres

- name: Grant CONNECT to group roles
  community.postgresql.postgresql_privs:
    db: "{{ postgresql_app_db }}"
    type: database
    objs: "{{ postgresql_app_db }}"
    roles: "{{ postgresql_app_group }},{{ postgresql_reader_group }}"
    privs: CONNECT
    port: "{{ postgresql_port }}"
  become: true
  become_user: postgres

# Обновление установки до DEP-08: таблицы принадлежали роли узла — передать их владельцу схемы.
- name: Find objects owned by the node role
  community.postgresql.postgresql_query:
    db: "{{ postgresql_app_db }}"
    query: >-
      SELECT count(*) AS n FROM pg_shdepend d JOIN pg_database b ON b.oid = d.dbid
      WHERE d.deptype = 'o' AND b.datname = current_database() AND d.refobjid = %(role)s::regrole
    named_args:
      role: "{{ postgresql_app_role }}"
    port: "{{ postgresql_port }}"
  register: postgresql_node_owned
  changed_when: false
  become: true
  become_user: postgres

- name: Reassign objects of the node role to the schema owner
  community.postgresql.postgresql_query:
    db: "{{ postgresql_app_db }}"
    query: 'REASSIGN OWNED BY "{{ postgresql_app_role }}" TO "{{ postgresql_owner_role }}"'
    port: "{{ postgresql_port }}"
  when: postgresql_node_owned.query_result[0].n | int > 0
  register: postgresql_reassigned
  become: true
  become_user: postgres

# Права групповых ролей на существующие таблицы (новые выдают миграции). До первого запуска thepost схемы нет.
- name: Grant table privileges to group roles
  community.postgresql.postgresql_query:
    db: "{{ postgresql_app_db }}"
    query: >-
      DO $$ BEGIN IF to_regprocedure('public.tp_grant_roles()') IS NOT NULL THEN PERFORM public.tp_grant_roles();
      END IF; END $$
    port: "{{ postgresql_port }}"
  when: postgresql_groups is changed or postgresql_memberships is changed or postgresql_reassigned is changed
  become: true
  become_user: postgres
