# Установка PostgreSQL для The Post (Debian, Ubuntu). Повторный прогон ничего не меняет.
---
- name: Check OS family
  ansible.builtin.assert:
    that: ansible_os_family == 'Debian'
    fail_msg: "Роль postgresql эталона SMB поддерживает Debian и Ubuntu"

- name: Check PostgreSQL password of role thepost
  ansible.builtin.assert:
    that: thepost_db_password is defined and thepost_db_password | length > 0
    fail_msg: "Нет thepost_db_password: роль openbao выполняется раньше (пароль хранится в OpenBao, thepost/db)"
  no_log: true

- name: Add PGDG repository
  ansible.builtin.deb822_repository:
    name: pgdg
    uris: "{{ postgresql_pgdg_uri }}"
    suites: "{{ ansible_distribution_release }}-pgdg"
    components: [main]
    signed_by: "{{ postgresql_pgdg_key_url }}"
  when: postgresql_pgdg_repo
  register: postgresql_repo

- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - python3-psycopg2
      - acl  # become_user postgres
    state: present
    update_cache: "{{ postgresql_repo is changed }}"

- name: Copy TLS certificate
  ansible.builtin.copy:
    src: "{{ postgresql_tls_cert_src }}"
    dest: "{{ postgresql_conf_dir }}/thepost-server.pem"
    remote_src: true
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Reload postgresql

- name: Copy TLS key
  ansible.builtin.copy:
    src: "{{ postgresql_tls_key_src }}"
    dest: "{{ postgresql_conf_dir }}/thepost-server.key"
    remote_src: true
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reload postgresql

- name: Write PostgreSQL settings
  ansible.builtin.template:
    src: thepost.conf.j2
    dest: "{{ postgresql_conf_dir }}/conf.d/thepost.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart postgresql

- name: Write pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Reload postgresql

- name: Start PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgresql_service }}"
    state: started
    enabled: true

- name: Apply pending restart
  ansible.builtin.meta: flush_handlers

# Пароль задаётся при создании роли: повторный прогон его не сравнивает (SCRAM). Смена пароля — в OpenBao и
# ALTER ROLE вручную или postgresql_update_password: always (прогон станет «changed»).
- name: Create role thepost
  community.postgresql.postgresql_user:
    name: "{{ postgresql_app_role }}"
    password: "{{ thepost_db_password }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOBYPASSRLS,NOCREATEDB,NOCREATEROLE,NOREPLICATION
    update_password: "{{ postgresql_update_password }}"
    port: "{{ postgresql_port }}"
  become: true
  become_user: postgres
  no_log: true

- name: Create database thepost
  community.postgresql.postgresql_db:
    name: "{{ postgresql_app_db }}"
    owner: "{{ postgresql_app_role }}"
    port: "{{ postgresql_port }}"
  become: true
  become_user: postgres

- name: Revoke database access from PUBLIC
  community.postgresql.postgresql_privs:
    db: "{{ postgresql_app_db }}"
    type: database
    objs: "{{ postgresql_app_db }}"
    roles: PUBLIC
    privs: ALL
    state: absent
    port: "{{ postgresql_port }}"
  become: true
  become_user: postgres
