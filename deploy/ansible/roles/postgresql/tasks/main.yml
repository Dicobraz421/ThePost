# Установка PostgreSQL для The Post (Debian, Ubuntu, Astra Linux SE; РЕД ОС, AlmaLinux, RHEL). Повторный прогон ничего
# не меняет.
---
- name: Check OS family
  ansible.builtin.assert:
    that: ansible_pkg_mgr in ['apt', 'dnf', 'dnf5']
    fail_msg: >-
      Роль postgresql эталона SMB поддерживает Debian, Ubuntu, Astra Linux SE (apt) и РЕД ОС, AlmaLinux, RHEL (dnf)

- name: Check PostgreSQL passwords
  ansible.builtin.assert:
    that:
      - thepost_db_password is defined and thepost_db_password | length > 0
      - thepost_db_owner_password is defined and thepost_db_owner_password | length > 0
      - thepost_db_readonly_password is defined and thepost_db_readonly_password | length > 0
    fail_msg: >-
      Нет thepost_db_password, thepost_db_owner_password или thepost_db_readonly_password: роль openbao выполняется
      раньше (пароли хранятся в OpenBao: thepost/db, thepost/db-owner, thepost/db-readonly)
  no_log: true

# deb822_repository требует python3-debian (в Debian 13 и Ubuntu 26.04 не стоит по умолчанию).
- name: Install python3-debian for deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not postgresql_rhel | bool and postgresql_pgdg_repo | bool

- name: Add PGDG repository (apt)
  ansible.builtin.deb822_repository:
    name: pgdg
    uris: "{{ postgresql_pgdg_uri }}"
    suites: "{{ postgresql_pgdg_suite }}"
    components: [main]
    signed_by: "{{ postgresql_pgdg_key_url }}"
  when: not postgresql_rhel | bool and postgresql_pgdg_repo | bool
  register: postgresql_repo

- name: Install PostgreSQL (apt)
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - python3-psycopg2
      - acl  # become_user postgres
    state: present
    update_cache: "{{ postgresql_repo is changed }}"
  when: not postgresql_rhel | bool

# PGDG для AlmaLinux и RHEL: пакеты версии и общий (pgBackRest — роль pgbackrest). Каталог — по ansible_architecture:
# $basearch AlmaLinux 10 для x86-64-v2 — x86_64_v2, таких каталогов у PGDG нет.
- name: Add PGDG repositories (dnf)
  ansible.builtin.yum_repository:
    name: "{{ item.name }}"
    description: "PostgreSQL PGDG {{ item.name }}"
    baseurl: "{{ postgresql_pgdg_yum_uri }}/{{ item.path }}/redhat/rhel-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}"
    gpgcheck: true
    gpgkey: "{{ postgresql_pgdg_yum_key_url }}"
  loop:
    - { name: "pgdg{{ postgresql_version }}", path: "{{ postgresql_version }}" }
    - { name: pgdg-common, path: common }
  loop_control:
    label: "{{ item.name }}"
  when: postgresql_rhel | bool and postgresql_pgdg_repo | bool

- name: Install PostgreSQL (dnf)
  ansible.builtin.dnf:
    name:
      - "postgresql{{ postgresql_version }}-server"
      - python3-psycopg2
      - acl  # become_user postgres
    state: present
  when: postgresql_rhel | bool

# Кластер семейства RHEL создаётся явно; языковая настройка — как у БД thepost (решение 2026-11-11 №23).
- name: Initialize PostgreSQL cluster (dnf)
  ansible.builtin.command:
    cmd: "{{ postgresql_setup_cmd }} initdb"
    creates: "{{ postgresql_data_dir }}/PG_VERSION"
  environment:
    PGSETUP_INITDB_OPTIONS: >-
      --encoding={{ postgresql_app_db_encoding }} --locale={{ postgresql_app_db_locale }}
      --auth-local=peer --auth-host=scram-sha-256
  when: postgresql_rhel | bool

# Debian подключает conf.d в postgresql.conf пакета, семейство RHEL — нет.
- name: Create conf.d directory (dnf)
  ansible.builtin.file:
    path: "{{ postgresql_conf_dir }}/conf.d"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  when: postgresql_rhel | bool

- name: Include conf.d (dnf)
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_dir }}/postgresql.conf"
    regexp: '^#?include_dir\s*='
    line: "include_dir = 'conf.d'"
  when: postgresql_rhel | bool
  notify: Restart postgresql

- name: Copy TLS certificate
  ansible.builtin.copy:
    src: "{{ postgresql_tls_cert_src }}"
    dest: "{{ postgresql_conf_dir }}/thepost-server.pem"
    remote_src: true
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Reload postgresql

- name: Copy TLS key
  ansible.builtin.copy:
    src: "{{ postgresql_tls_key_src }}"
    dest: "{{ postgresql_conf_dir }}/thepost-server.key"
    remote_src: true
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reload postgresql

- name: Write PostgreSQL settings
  ansible.builtin.template:
    src: thepost.conf.j2
    dest: "{{ postgresql_conf_dir }}/conf.d/thepost.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart postgresql

- name: Write pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Reload postgresql

# Без интерпретаторов в работе (SRS 7.1, решение 2026-11-01): юнит кластера Debian запускает pg_ctlcluster (Perl) —
# drop-in запускает postgres напрямую (Type=notify; пакеты PGDG собраны с поддержкой systemd). Юнит семейства RHEL
# запускает postgres сам. Каталог drop-in — и для роли pgbackrest.
- name: Create cluster unit drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ postgresql_unit }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Run postgres without pg_ctlcluster
  ansible.builtin.template:
    src: no-interpreter.conf.j2
    dest: "/etc/systemd/system/{{ postgresql_unit }}.d/thepost.conf"
    owner: root
    group: root
    mode: "0644"
  when: not postgresql_rhel | bool
  notify: Restart postgresql

- name: Start PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgresql_service }}"
    state: started
    enabled: true

- name: Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Accounts and database
  ansible.builtin.import_tasks: accounts.yml
