# Установка PostgreSQL для The Post (Debian, Ubuntu). Повторный прогон ничего не меняет.
---
- name: Check OS family
  ansible.builtin.assert:
    that: ansible_os_family == 'Debian'
    fail_msg: "Роль postgresql эталона SMB поддерживает Debian и Ubuntu"

- name: Check PostgreSQL passwords
  ansible.builtin.assert:
    that:
      - thepost_db_password is defined and thepost_db_password | length > 0
      - thepost_db_owner_password is defined and thepost_db_owner_password | length > 0
      - thepost_db_readonly_password is defined and thepost_db_readonly_password | length > 0
    fail_msg: >-
      Нет thepost_db_password, thepost_db_owner_password или thepost_db_readonly_password: роль openbao выполняется
      раньше (пароли хранятся в OpenBao: thepost/db, thepost/db-owner, thepost/db-readonly)
  no_log: true

- name: Add PGDG repository
  ansible.builtin.deb822_repository:
    name: pgdg
    uris: "{{ postgresql_pgdg_uri }}"
    suites: "{{ ansible_distribution_release }}-pgdg"
    components: [main]
    signed_by: "{{ postgresql_pgdg_key_url }}"
  when: postgresql_pgdg_repo
  register: postgresql_repo

- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - python3-psycopg2
      - acl  # become_user postgres
    state: present
    update_cache: "{{ postgresql_repo is changed }}"

- name: Copy TLS certificate
  ansible.builtin.copy:
    src: "{{ postgresql_tls_cert_src }}"
    dest: "{{ postgresql_conf_dir }}/thepost-server.pem"
    remote_src: true
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Reload postgresql

- name: Copy TLS key
  ansible.builtin.copy:
    src: "{{ postgresql_tls_key_src }}"
    dest: "{{ postgresql_conf_dir }}/thepost-server.key"
    remote_src: true
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reload postgresql

- name: Write PostgreSQL settings
  ansible.builtin.template:
    src: thepost.conf.j2
    dest: "{{ postgresql_conf_dir }}/conf.d/thepost.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart postgresql

- name: Write pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Reload postgresql

# Без интерпретаторов в работе (SRS 7.1, решение 2026-11-01): юнит кластера Debian запускает pg_ctlcluster (Perl) —
# drop-in запускает postgres напрямую (Type=notify; пакеты PGDG собраны с поддержкой systemd).
- name: Create cluster unit drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/postgresql@{{ postgresql_version }}-{{ postgresql_cluster }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Run postgres without pg_ctlcluster
  ansible.builtin.template:
    src: no-interpreter.conf.j2
    dest: "/etc/systemd/system/postgresql@{{ postgresql_version }}-{{ postgresql_cluster }}.service.d/thepost.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart postgresql

- name: Start PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgresql_service }}"
    state: started
    enabled: true

- name: Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Accounts and database
  ansible.builtin.import_tasks: accounts.yml
