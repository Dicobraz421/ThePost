# Секреты копий (DEP-15): источник — OpenBao (KV {{ thepost_backup_openbao_mount }}, узлу thepost недоступен), на ВМ —
# только учётные данные systemd, зашифрованные systemd-creds (ключ ВМ и TPM2, если есть). Повторный прогон ничего
# не меняет.
---
# Ключ шифрования pgBackRest и пароль restic — случайные при первом прогоне; ключи S3 заводит администратор.
- name: Create backup secrets in OpenBao
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      m={{ thepost_backup_openbao_mount | quote }}
      changed=no
      mounts=$(bao secrets list)
      if ! grep -q "^$m/" <<<"$mounts"; then bao secrets enable -path="$m" -version=2 kv >/dev/null; changed=yes; fi
      for s in pgbackrest:cipher_pass restic:password; do
        # Создавать только при явном «нет значения»: перезапись ключа сделает прежние копии нечитаемыми.
        if out=$(bao kv get -mount="$m" -field="${s#*:}" "${s%%:*}" 2>&1); then continue; fi
        if ! grep -q 'No value found' <<<"$out"; then echo "OpenBao: ${s%%:*}: ${out##*$'\n'}" >&2; exit 1; fi
        head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' | bao kv put -mount="$m" "${s%%:*}" "${s#*:}=-" >/dev/null
        changed=yes
      done
      echo "changed=$changed"
    executable: /bin/bash
  environment: "{{ openbao_cli_env }}"
  register: thepost_backup_bootstrap
  changed_when: "'changed=yes' in thepost_backup_bootstrap.stdout"
  no_log: true

- name: Read backup secrets from OpenBao
  ansible.builtin.command: bao kv get -mount={{ thepost_backup_openbao_mount | quote }} -format=json {{ item }}
  environment: "{{ openbao_cli_env }}"
  loop: [pgbackrest, restic, s3]
  register: thepost_backup_secrets
  changed_when: false
  failed_when: false
  no_log: true

- name: Collect backup secrets
  ansible.builtin.set_fact:
    thepost_backup_secret: >-
      {{ dict(thepost_backup_secrets.results
              | map(attribute='item')
              | zip(thepost_backup_secrets.results
                    | map(attribute='stdout')
                    | map('default', '', true)
                    | map('regex_replace', '^$', '{"data": {"data": {}}}')
                    | map('from_json') | map(attribute='data') | map(attribute='data'))) }}
    thepost_backup_uses_s3: >-
      {{ thepost_backup_repo == 's3' or (thepost_backup_blob_tool == 'restic' and thepost_backup_restic_repo is match('s3:')) }}
  no_log: true

- name: Check S3 keys in OpenBao
  ansible.builtin.assert:
    that:
      - thepost_backup_secret.s3.access_key_id | default('') | length > 0
      - thepost_backup_secret.s3.secret_access_key | default('') | length > 0
    fail_msg: >-
      Копии в S3: положите ключи в OpenBao (на ВМ, с токеном администратора) —
      bao kv put -mount={{ thepost_backup_openbao_mount }} s3 access_key_id=… secret_access_key=…
  when: thepost_backup_uses_s3 | bool
  no_log: true

- name: Create credentials directory
  ansible.builtin.file:
    path: "{{ thepost_backup_creds_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Содержимое сравнивается с уже зашифрованным (расшифровка — в память), перешифровка — только при изменении.
- name: Encrypt backup credentials (systemd-creds)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 077
      new=$(cat)
      f={{ (thepost_backup_creds_dir ~ '/' ~ item.file) | quote }}
      n={{ item.name | quote }}
      if [ -f "$f" ] && cmp -s <(systemd-creds decrypt --name="$n" "$f" - 2>/dev/null) <(printf '%s\n' "$new"); then
        echo unchanged; exit 0
      fi
      printf '%s\n' "$new" | systemd-creds encrypt --with-key={{ thepost_backup_creds_key | quote }} --name="$n" - "$f.new" 2>/dev/null
      mv -f "$f.new" "$f"
      echo changed
    stdin: "{{ item.content }}"
    executable: /bin/bash
  loop: "{{ thepost_backup_creds }}"
  loop_control:
    label: "{{ item.file }}"
  register: thepost_backup_creds_written
  changed_when: "'changed' == thepost_backup_creds_written.stdout"
  notify: Restart postgresql for pgbackrest
  vars:
    thepost_backup_creds: >-
      {{ [{'name': 'pgbackrest.conf', 'file': 'pgbackrest.cred', 'content': lookup('template', 'cred-pgbackrest.conf.j2')}]
         + ([{'name': 'restic.password', 'file': 'restic-password.cred',
              'content': thepost_backup_secret.restic.password}] if thepost_backup_blob_tool == 'restic' else [])
         + ([{'name': 'restic.aws', 'file': 'restic-aws.cred', 'content': lookup('template', 'cred-restic-aws.j2')}]
            if thepost_backup_blob_tool == 'restic' and thepost_backup_restic_repo is match('s3:') else []) }}
  no_log: true
