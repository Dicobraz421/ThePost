# Роль thepost_pki: внутренний CA узла SMB для внутренних каналов (PostgreSQL, OpenBao) — только TLS
# (решение 2026-10-30). Повторный прогон ничего не меняет, пока до конца срока сертификата больше
# thepost_pki_renew_before: тогда он перевыпускается тем же CA (решение 2026-11-11 №27). Новый CA (истёк срок или
# компрометация) — удалить {{ thepost_pki_dir }} и повторить прогон.
---
thepost_pki_dir: /etc/thepost/pki
thepost_pki_ca_common_name: "The Post internal CA ({{ inventory_hostname }})"
thepost_pki_ca_not_after: "+3650d"
thepost_pki_cert_not_after: "+825d"
# Перевыпуск сертификатов (internal, client), если до конца срока осталось меньше этого (формат — как *_not_after).
thepost_pki_renew_before: "+90d"
# Сертификат внутренних служб узла (internal.pem, internal.key): клиенты thepost подключаются к localhost.
thepost_pki_internal_names:
  - "DNS:localhost"
  - "DNS:{{ ansible_fqdn }}"
  - "IP:127.0.0.1"
  - "IP:::1"
