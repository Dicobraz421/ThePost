# Установка clamd, freshclam и clamav-milter (Debian, Ubuntu, Astra Linux SE; AlmaLinux, RHEL — EPEL). Повторный
# прогон ничего не меняет.
---
- name: Check OS family
  ansible.builtin.assert:
    that:
      - ansible_pkg_mgr in ['apt', 'dnf', 'dnf5']
      - ansible_distribution != 'RED'
    fail_msg: >-
      Роль clamav_milter поддерживает Debian, Ubuntu, Astra Linux SE, AlmaLinux и RHEL (EPEL); в репозиториях РЕД ОС 8
      ClamAV нет — thepost_clamav: false или свой фильтр Milter (smtp.milter)

- name: Enable EPEL
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: clamav_epel | bool

- name: Install ClamAV
  ansible.builtin.package:
    name: "{{ clamav_packages }}"
    state: present

# Пакеты EPEL: в образцах настроек строка Example (служба не запускается), сокет clamd выключен.
- name: Enable ClamAV configuration (EPEL)
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '^Example\s*$'
    state: absent
  loop: [/etc/freshclam.conf, "{{ clamav_clamd_conf }}", "{{ clamav_milter_conf }}"]
  when: clamav_rhel | bool
  notify: [Restart clamd, Restart clamav-milter]

- name: Configure clamd socket (EPEL)
  ansible.builtin.lineinfile:
    path: "{{ clamav_clamd_conf }}"
    regexp: '^#?LocalSocket\s'
    line: "LocalSocket {{ clamav_clamd_socket }}"
  when: clamav_rhel | bool
  notify: Restart clamd

- name: Start freshclam
  ansible.builtin.systemd_service:
    name: clamav-freshclam
    state: started
    enabled: true

- name: Wait for virus databases
  ansible.builtin.find:
    paths: /var/lib/clamav
    patterns: ["daily.cvd", "daily.cld"]
  register: clamav_db
  until: clamav_db.matched > 0
  retries: "{{ clamav_db_wait_retries }}"
  delay: "{{ clamav_db_wait_delay }}"

- name: Configure clamav-milter
  ansible.builtin.lineinfile:
    path: "{{ clamav_milter_conf }}"
    regexp: "^#?{{ item.key }} "
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - { key: MilterSocket, value: "inet:{{ clamav_milter_address.split(':') | last }}@{{ clamav_milter_address.split(':') | first }}" }
    - { key: ClamdSocket, value: "unix:{{ clamav_clamd_socket }}" }
    - { key: OnInfected, value: "{{ clamav_milter_on_infected }}" }
    - { key: AddHeader, value: Replace }
  notify: Restart clamav-milter

- name: Start clamd and clamav-milter
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: ["{{ clamav_clamd_service }}", clamav-milter]
