# Роль rspamd: антиспам профиля SMB (SRS 1.2) — пакет проекта Rspamd, проверка через Milter (worker proxy).
# thepost подключается к rspamd_milter_address (секция smtp.milter, фильтр rspamd).
---
# true — репозиторий rspamd.com (рекомендация проекта Rspamd); false — пакет дистрибутива.
rspamd_official_repo: true
rspamd_repo_uri: https://rspamd.com/apt-stable/
rspamd_repo_key_url: https://rspamd.com/apt-stable/gpg.key
rspamd_service: rspamd

# Все рабочие процессы — только loopback: thepost на той же ВМ.
rspamd_milter_address: "127.0.0.1:11332"
rspamd_normal_address: "127.0.0.1:11333"
rspamd_controller_address: "127.0.0.1:11334"
