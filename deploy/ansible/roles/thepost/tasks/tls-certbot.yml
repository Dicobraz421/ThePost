# Let's Encrypt через certbot (ACME HTTP-01, --standalone): порт 80 узла открыт из интернета, имена
# thepost_tls_names указывают на узел (DNS A/AAAA). Продление — certbot.timer пакета; deploy-hook записывает ключ
# новой версией секрета thepost/tls#key (вход AppRole узла; bao — из пакета OpenBao на этой ВМ) и копирует цепочку,
# thepost перечитывает пару без перезапуска. Смена списка имён — certbot certonly --expand вручную.
# AlmaLinux: certbot — из EPEL; РЕД ОС — пакет дистрибутива; RHEL — EPEL подключает администратор.
---
- name: Check certbot availability
  ansible.builtin.assert:
    that: ansible_distribution is not match('Astra')
    fail_msg: >-
      В репозиториях Astra Linux SE 1.8 нет certbot: thepost_tls_mode: acme (встроенный клиент ACME thepost) или files

- name: Check OpenBao CLI for certbot deploy hook
  ansible.builtin.command: sh -c 'command -v bao'
  register: thepost_certbot_bao
  changed_when: false
  failed_when: thepost_certbot_bao.rc != 0
  check_mode: false

- name: Enable EPEL for certbot
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_pkg_mgr != 'apt' and ansible_distribution not in ['RedHat', 'RED']

- name: Install certbot
  ansible.builtin.package:
    name: certbot
    state: present

- name: Create certbot hook directory
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install certbot deploy hook
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/thepost.sh
    content: |
      #!/bin/sh
      # Ansible: deploy/ansible/roles/thepost — не править вручную.
      # Продлённый сертификат thepost: ключ — новой версией секрета thepost/tls#key (AppRole узла, политика thepost),
      # затем цепочка — в путь секции tls; узел перечитывает пару сам.
      set -eu
      [ "${RENEWED_LINEAGE:-}" = /etc/letsencrypt/live/thepost ] || exit 0
      export BAO_ADDR={{ thepost_secrets_url | quote }} BAO_CACERT={{ thepost_internal_ca_file | quote }}
      BAO_TOKEN=$(bao write -field=token auth/approle/login role_id=@{{ thepost_secrets_role_id_file | quote }}         secret_id=@{{ thepost_secrets_secret_id_file | quote }})
      export BAO_TOKEN
      bao kv put -mount=thepost tls key=@"$RENEWED_LINEAGE/privkey.pem" >/dev/null
      bao token revoke -self >/dev/null 2>&1 || true
      install -o root -g thepost -m 0644 "$RENEWED_LINEAGE/fullchain.pem" /etc/thepost/tls/fullchain.pem
    owner: root
    group: root
    mode: "0755"

- name: Issue certificate (certbot)
  ansible.builtin.command:
    argv: >-
      {{ ['certbot', 'certonly', '--standalone', '--non-interactive', '--agree-tos',
          '--email', thepost_acme_email, '--cert-name', 'thepost']
         + (['--server', thepost_acme_directory_url] if thepost_acme_directory_url | length > 0 else [])
         + (thepost_tls_names | map('regex_replace', '^', '--domain=') | list) }}
    creates: /etc/letsencrypt/live/thepost/fullchain.pem

# Пакет Debian включает certbot.timer сам; РЕД ОС, AlmaLinux — certbot-renew.timer выключен.
- name: Enable certbot renewal timer
  ansible.builtin.systemd_service:
    name: certbot-renew.timer
    state: started
    enabled: true
  when: ansible_pkg_mgr != 'apt'

- name: Read key of client protocols (certbot)
  ansible.builtin.slurp:
    src: /etc/letsencrypt/live/thepost/privkey.pem
  register: thepost_certbot_key
  no_log: true

- name: Store key of client protocols in OpenBao (certbot)
  ansible.builtin.include_role:
    name: openbao
    tasks_from: kv
  vars:
    openbao_kv_from: "{{ thepost_openbao_from }}"
    openbao_kv_path: tls
    openbao_kv_field: key
    openbao_kv_value: "{{ thepost_certbot_key.content | b64decode }}"

- name: Install certificate of client protocols (certbot)
  ansible.builtin.copy:
    src: /etc/letsencrypt/live/thepost/fullchain.pem
    dest: /etc/thepost/tls/fullchain.pem
    remote_src: true
    owner: root
    group: thepost
    mode: "0644"
