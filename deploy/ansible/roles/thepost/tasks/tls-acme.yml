# Встроенный клиент ACME thepost (секция acme, SRS 6.2; единственный способ Let's Encrypt — решение 101): сертификат
# выпускает и продлевает сам thepost (HTTP-01 — сокет thepost-http.socket, порт 80). Цепочка — /var/lib/thepost/tls
# (StateDirectory юнита — запись разрешена при ProtectSystem=strict), закрытый ключ — секрет OpenBao
# thepost_acme_key_secret (tls.key, PLT-29).
---
- name: Create ACME directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: thepost
    group: thepost
    mode: "0750"
  loop:
    - /var/lib/thepost
    - /var/lib/thepost/tls
    - /var/lib/thepost/acme
