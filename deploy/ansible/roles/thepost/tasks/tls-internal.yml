# Сертификат от внутреннего CA (роль thepost_pki): стенд и тест; клиентам — CA {{ thepost_pki_dir }}/ca.pem.
# Ключ — только в OpenBao (секрет thepost/tls#key, решение 100), на диск не пишется.
---
- name: Issue certificate of client protocols (internal CA)
  ansible.builtin.include_role:
    name: thepost_pki
    tasks_from: issue
  vars:
    thepost_pki_issue_name: client
    thepost_pki_issue_dir: "{{ thepost_pki_dir }}"
    thepost_pki_issue_names: "{{ thepost_tls_names | map('regex_replace', '^', 'DNS:') | list }}"
    thepost_pki_issue_key_secret: tls
    thepost_pki_issue_openbao_from: "{{ thepost_openbao_from }}"

- name: Install certificate of client protocols
  ansible.builtin.copy:
    src: "{{ thepost_pki_dir }}/client.pem"
    dest: /etc/thepost/tls/fullchain.pem
    remote_src: true
    owner: root
    group: thepost
    mode: "0644"
