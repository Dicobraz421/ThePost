# Установка thepost на ВМ (эталон SMB). Повторный прогон ничего не меняет.
---
- name: Check parameters
  ansible.builtin.assert:
    that:
      - thepost_tls_mode in ['acme', 'internal', 'files']
      - thepost_tls_mode != 'acme' or thepost_acme_email | length > 0
      - thepost_tls_mode != 'files' or (thepost_tls_cert_src | length > 0 and thepost_tls_key_src | length > 0)
      - thepost_binary_url | length == 0 or thepost_binary_checksum | length > 0
    fail_msg: >-
      thepost_tls_mode — acme, internal или files; для acme нужен thepost_acme_email,
      для files — thepost_tls_cert_src и thepost_tls_key_src; thepost_binary_url — с thepost_binary_checksum

# До бинарного файла: проверка config.yaml (validate) уже запускает thepost.
- name: Install system libraries
  ansible.builtin.package:
    name: "{{ thepost_system_packages }}"
    state: present

- name: Install system user (sysusers.d)
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../systemd/thepost.sysusers.conf"
    dest: /usr/lib/sysusers.d/thepost.conf
    owner: root
    group: root
    mode: "0644"
  register: thepost_sysusers

- name: Create system user thepost
  ansible.builtin.command: systemd-sysusers /usr/lib/sysusers.d/thepost.conf
  when: thepost_sysusers is changed  # noqa: no-handler — группа нужна следующим задачам
  changed_when: true

- name: Download thepost binary
  ansible.builtin.get_url:
    url: "{{ thepost_binary_url }}"
    checksum: "{{ thepost_binary_checksum }}"
    dest: "{{ thepost_binary_path }}"
    owner: root
    group: root
    mode: "0755"
  when: thepost_binary_url | length > 0
  notify: Restart thepost

- name: Copy thepost binary
  ansible.builtin.copy:
    src: "{{ thepost_binary_src }}"
    dest: "{{ thepost_binary_path }}"
    owner: root
    group: root
    mode: "0755"
  when: thepost_binary_url | length == 0
  notify: Restart thepost

- name: Install systemd unit
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../systemd/thepost.service"
    dest: /etc/systemd/system/thepost.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart thepost

# thepost-http.socket (порт 80) — проверки ACME HTTP-01, включается только с thepost_tls_mode: acme.
- name: Install systemd socket units
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../systemd/thepost-{{ item }}.socket"
    dest: "/etc/systemd/system/thepost-{{ item }}.socket"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ thepost_sockets + ['http'] }}"

- name: Create unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/thepost.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Order thepost after local services (SMB)
  ansible.builtin.copy:
    dest: /etc/systemd/system/thepost.service.d/smb.conf
    content: |
      # Ansible: deploy/ansible/roles/thepost — не править вручную.
      # Эталон SMB: PostgreSQL, OpenBao и фильтры Milter — на этой же ВМ.
      [Unit]
      Wants={{ thepost_local_units | join(' ') }}
      After={{ thepost_local_units | join(' ') }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart thepost

# Keytab Kerberos: MIT Kerberos читает его только из KRB5_KTNAME (auth.gssapi.keytab сверяется с переменной).
- name: Set keytab path for thepost (KRB5_KTNAME)
  ansible.builtin.copy:
    dest: /etc/systemd/system/thepost.service.d/gssapi.conf
    content: |
      # Ansible: deploy/ansible/roles/thepost — не править вручную.
      [Service]
      Environment=KRB5_KTNAME=FILE:{{ thepost_gssapi_keytab }}
    owner: root
    group: root
    mode: "0644"
  when: thepost_gssapi_keytab_src | length > 0
  notify: Restart thepost

- name: Remove keytab path without Kerberos
  ansible.builtin.file:
    path: /etc/systemd/system/thepost.service.d/gssapi.conf
    state: absent
  when: thepost_gssapi_keytab_src | length == 0
  notify: Restart thepost

# Растущая пауза перезапуска (RestartSteps, RestartMaxDelaySec) — systemd 254+; на старых — постоянные 30 с
# (решение 85).
- name: Check systemd version
  ansible.builtin.command: systemctl --version
  register: thepost_systemd_version
  changed_when: false
  check_mode: false

- name: Constant restart delay on systemd < 254
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../systemd/thepost.service.d/restart-legacy.conf"
    dest: /etc/systemd/system/thepost.service.d/restart-legacy.conf
    owner: root
    group: root
    mode: "0644"
  when: thepost_systemd_version.stdout_lines[0].split()[1] | int < 254
  notify: Restart thepost

- name: Growing restart delay on systemd 254+
  ansible.builtin.file:
    path: /etc/systemd/system/thepost.service.d/restart-legacy.conf
    state: absent
  when: thepost_systemd_version.stdout_lines[0].split()[1] | int >= 254
  notify: Restart thepost

- name: Create configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: thepost
    mode: "0750"
  loop:
    - /etc/thepost
    - /etc/thepost/tls

# firewalld (РЕД ОС, AlmaLinux, RHEL; включён — открыть порты клиентских протоколов, ACME — и 80).
- name: Check firewalld
  ansible.builtin.command: systemctl is-active firewalld
  register: thepost_firewalld
  changed_when: false
  failed_when: false

- name: Open client ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ thepost_firewall_ports + ([80] if thepost_tls_mode == 'acme' else []) }}"
  when: thepost_firewalld.stdout == 'active'

- name: Certificate of client protocols
  ansible.builtin.include_tasks: "tls-{{ thepost_tls_mode }}.yml"

# Ключ TLS — только в секрете thepost/tls (решение 100): файлы ключа прежних установок удаляются.
- name: Remove key files of client protocols
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/thepost/tls/privkey.pem
    - /var/lib/thepost/tls/privkey.pem
    - "{{ thepost_pki_dir | default('/etc/thepost/pki') }}/client.key"

- name: Copy Kerberos keytab
  ansible.builtin.copy:
    src: "{{ thepost_gssapi_keytab_src }}"
    dest: "{{ thepost_gssapi_keytab }}"
    owner: root
    group: thepost
    mode: "0640"
  when: thepost_gssapi_keytab_src | length > 0
  notify: Restart thepost

- name: Remove Kerberos keytab without Kerberos
  ansible.builtin.file:
    path: "{{ thepost_gssapi_keytab }}"
    state: absent
  when: thepost_gssapi_keytab_src | length == 0

# Проверка auth.gssapi.keytab сверяет KRB5_KTNAME — та же переменная, что в drop-in gssapi.conf.
- name: Write config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/thepost/config.yaml
    owner: root
    group: thepost
    mode: "0640"
    validate: "{{ thepost_binary_path }} config check --config %s"
  environment: >-
    {{ {'KRB5_KTNAME': 'FILE:' ~ thepost_gssapi_keytab} if thepost_gssapi_keytab_src | length > 0 else {} }}
  notify: Restart thepost

# Порты ниже 1024 — только сокеты systemd (решение 102): у процесса нет capabilities.
- name: Enable systemd sockets
  ansible.builtin.systemd_service:
    name: "thepost-{{ item }}.socket"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ thepost_sockets + (['http'] if thepost_tls_mode == 'acme' else []) }}"
  notify: Restart thepost

- name: Disable ACME HTTP-01 socket without ACME
  ansible.builtin.systemd_service:
    name: thepost-http.socket
    state: stopped
    enabled: false
    daemon_reload: true
  when: thepost_tls_mode != 'acme'
  notify: Restart thepost

- name: Start thepost
  ansible.builtin.systemd_service:
    name: thepost
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending restart
  ansible.builtin.meta: flush_handlers

# Проверка готовности на loopback: имя в сертификате — thepost_hostname, не 127.0.0.1.
- name: Wait for thepost readiness
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ thepost_service_http_port }}/healthz/ready"
    validate_certs: false
  register: thepost_ready
  until: thepost_ready.status == 200
  retries: "{{ thepost_ready_retries }}"
  delay: "{{ thepost_ready_delay }}"
  when: thepost_wait_ready | bool

# thepost_wait_ready: false — одна проверка без ожидания (новый сервер до restore.yml: узел ждёт секретов из снимка).
- name: Check thepost readiness once
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ thepost_service_http_port }}/healthz/ready"
    validate_certs: false
  register: thepost_ready_once
  failed_when: false
  when: not thepost_wait_ready | bool

- name: Warn that thepost is not ready
  ansible.builtin.debug:
    msg: >-
      ВНИМАНИЕ: thepost не готов (/healthz/ready — {{ 'нет ответа' if thepost_ready_once.status | default(-1) | int < 0
        else thepost_ready_once.status }}),
      ожидание выключено (thepost_wait_ready: false). На новом сервере это ожидаемо до restore.yml с
      thepost_restore_openbao=true; причина — journalctl -u thepost.
  when: not thepost_wait_ready | bool and thepost_ready_once.status | default(0) != 200
