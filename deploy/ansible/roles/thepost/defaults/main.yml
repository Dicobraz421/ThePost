# Роль thepost: бинарный файл, пользователь, юнит systemd, config.yaml и сертификат клиентских протоколов
# (эталон SMB, SRS 1.2, 5.6). Юнит и sysusers — deploy/systemd; пример конфигурации — deploy/config/all.yaml.
---
# Основной домен и имя узла (SMTP banner/HELO, сертификат клиентских протоколов). Локальные домены SMTP — принятые
# домены организации в БД (решение 96): `thepost admin init` заводит домен адреса администратора, другие —
# `thepost admin domain add <домен>`.
thepost_domain: example.ru
thepost_hostname: "mail.{{ thepost_domain }}"

# Бинарный файл: thepost_binary_url (+ thepost_binary_checksum "sha256:…") или файл на управляющей машине.
thepost_binary_url: ""
thepost_binary_checksum: ""
thepost_binary_src: "{{ playbook_dir }}/../../target/release/thepost"
thepost_binary_path: /usr/local/bin/thepost

# Сертификат клиентских протоколов (SMTP, IMAP, JMAP, служебный HTTP). Ключ — только в OpenBao: секрет thepost/tls#key
# (tls.key, решение 100), на диске ВМ его нет; цепочка — файл секции tls. thepost перечитывает пару без перезапуска.
#   certbot  — Let's Encrypt (ACME HTTP-01, certbot --standalone на порту 80; продление — certbot.timer, deploy-hook
#              записывает ключ в OpenBao и копирует цепочку);
#   acme     — встроенный клиент ACME thepost (секция acme, SRS 6.2): ключ записывает сам узел, цепочка — в
#              /var/lib/thepost/tls;
#   internal — внутренний CA роли thepost_pki (стенд, тест; клиентам нужен {{ thepost_pki_dir }}/ca.pem);
#   files    — свои PEM с управляющей машины: thepost_tls_cert_src (цепочка), thepost_tls_key_src (ключ — в OpenBao).
thepost_tls_mode: certbot
thepost_tls_names: ["{{ thepost_hostname }}"]
thepost_tls_cert_src: ""
thepost_tls_key_src: ""
# ACME (certbot и acme): контакт учётной записи и каталог (пусто — Let's Encrypt; staging —
# https://acme-staging-v02.api.letsencrypt.org/directory).
thepost_acme_email: ""
thepost_acme_directory_url: ""

# Внутренние каналы — только TLS с проверкой имени (решение 2026-10-30): CA — роль thepost_pki.
thepost_internal_ca_file: "{{ thepost_pki_dir | default('/etc/thepost/pki') }}/ca.pem"
thepost_db_url: >-
  postgres://thepost@localhost:5432/thepost?sslmode=verify-full&sslrootcert={{ thepost_internal_ca_file }}
# Другие адреса кластера PostgreSQL (database.urls): узел выбирает первый доступный для записи из thepost_db_url и
# списка (Enterprise-ВМ — узлы данных pg_auto_failover, deploy/ansible/pg-ha.yml); пусто — единственный адрес.
# Сроки повтора и поиска primary — thepost_db_failover (database.failover, например { retry_for: 30s }).
thepost_db_urls: []
thepost_db_failover: {}
thepost_secrets_url: "{{ openbao_api_addr | default('https://localhost:8200') }}"
thepost_secrets_role_id_file: "{{ openbao_thepost_role_id_file | default('/etc/thepost/openbao/role_id') }}"
thepost_secrets_secret_id_file: >-
  {{ openbao_thepost_secret_id_file | default('/etc/thepost/credentials/openbao-secret-id') }}
# Узел OpenBao с токеном администратора (роль openbao, openbao_cli_env), через который роль записывает ключ TLS в
# секрет thepost/tls: эталон SMB — эта ВМ; малый Enterprise — узел инициализации кластера OpenBao.
thepost_openbao_from: "{{ inventory_hostname }}"

# Слушатели клиентских протоколов (адрес без порта). С активацией сокетов — 0.0.0.0 или [::]: сокеты systemd
# слушают все адреса (ListenStream=<порт>); другой адрес — и в drop-in юнитов thepost-*.socket.
thepost_listen_address: "0.0.0.0"
# Порты ниже 1024 (25, 465, 587, 143, 993, 443) слушает systemd (юниты thepost-*.socket) — у процесса нет
# capabilities (SRS 2.7, DEP-08). false — процессу выдаётся CAP_NET_BIND_SERVICE (drop-in bind-capability.conf),
# юниты сокетов выключены. По умолчанию false: приём сокетов systemd в thepost ещё не подключён (TODO(PLT-16)
# в crates/thepost/src/protocols.rs) — с true узел не займёт порты, уже занятые systemd.
thepost_socket_activation: false
thepost_sockets: [smtp, submissions, submission, imap, imaps, https]
# Admin API — только внутренний адрес (SRS 6.8): loopback, частные сети.
thepost_admin_listen: "127.0.0.1:8443"
# Владелец схемы для миграций (database.owner; роль postgresql, секрет thepost/db-owner в OpenBao): узел входит
# ролью thepost (thepost_app), схему меняет только при запуске миграций (meta.migrate_on_start).
thepost_db_owner_role: "{{ postgresql_owner_role | default('thepost_owner') }}"

# Службы этой ВМ (эталон SMB), с которыми запускается thepost (drop-in smb.conf): юнит PostgreSQL — по роли postgresql
# (Debian — postgresql.service, семейство RHEL — postgresql-<версия>.service).
thepost_local_units: >-
  {{ [(postgresql_service | default('postgresql')) ~ '.service', 'openbao.service', 'rspamd.service']
     + (['clamav-milter.service'] if thepost_clamav | bool else []) }}
# Порты клиентских протоколов в firewalld (если он включён): SMTP, submissions, submission, IMAP, IMAPS, HTTPS.
thepost_firewall_ports: [25, 465, 587, 143, 993, 443]

# Фильтры Milter: Rspamd (роль rspamd) и, при thepost_clamav, clamav-milter (роль clamav_milter).
thepost_rspamd_milter_address: "{{ rspamd_milter_address | default('127.0.0.1:11332') }}"
thepost_clamav: false
thepost_clamav_milter_address: "{{ clamav_milter_address | default('127.0.0.1:7357') }}"
# Проверять и почту пользователей (submission), не только входящую.
thepost_milter_submission: false

# Окно W (blob.gc.window, SRS 3.5): тело письма удаляется не раньше W после удаления последней ссылки; W не меньше
# глубины самой старой точки восстановления. С резервным копированием (роль pgbackrest) — глубина PITR + неделя между
# полными копиями + сутки запаса; пусто — значение узла по умолчанию (7d).
thepost_blob_gc_window: >-
  {{ (thepost_backup_retention_days | default(7) | int + 8) ~ 'd' if thepost_backup | default(true) | bool else '' }}

# Дополнительные параметры config.yaml — рекурсивно поверх эталона (списки заменяются), например:
#   thepost_config_extra: { auth: { ldap: { … } }, meta: { retention: { trash_retention: 15m } } }
thepost_config_extra: {}

# Ожидание готовности после запуска (/healthz/ready служебного HTTP, 127.0.0.1:8081). thepost_wait_ready: false —
# не ждать: плейбук завершается успешно с предупреждением, если узел не готов (решение 79; новый сервер перед
# restore.yml — ключи DKIM, SRS и ARC вернутся только из снимка OpenBao, docs/INSTALL.md).
thepost_wait_ready: true
thepost_service_http_port: 8081
thepost_ready_retries: 30
thepost_ready_delay: 2
