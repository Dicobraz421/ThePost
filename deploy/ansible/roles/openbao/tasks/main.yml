# Установка и начальная настройка OpenBao для The Post. Повторный прогон ничего не меняет.
---
- name: Check TLS sources
  ansible.builtin.assert:
    that:
      - openbao_tls_cert_src | length > 0
      - openbao_tls_key_src | length > 0
      - openbao_tls_ca_src | length > 0
    fail_msg: "Канал к OpenBao — только TLS: задайте openbao_tls_cert_src, openbao_tls_key_src, openbao_tls_ca_src"

- name: Download OpenBao package
  ansible.builtin.get_url:
    url: "{{ openbao_package_url }}"
    checksum: "{{ openbao_package_checksum }}"
    dest: "/var/cache/openbao_{{ openbao_version }}.{{ openbao_package_ext }}"
    mode: "0644"

- name: Install OpenBao package (deb)
  ansible.builtin.apt:
    deb: "/var/cache/openbao_{{ openbao_version }}.{{ openbao_package_ext }}"
  when: openbao_package_ext == 'deb'

- name: Install OpenBao package (rpm)
  ansible.builtin.dnf:
    name: "/var/cache/openbao_{{ openbao_version }}.{{ openbao_package_ext }}"
    disable_gpg_check: true  # пакет проверен по checksums.txt релиза
  when: openbao_package_ext == 'rpm'

- name: Create TLS directory
  ansible.builtin.file:
    path: "{{ openbao_config_dir }}/tls"
    state: directory
    owner: root
    group: "{{ openbao_user }}"
    mode: "0750"

- name: Copy TLS certificate and CA
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ openbao_config_dir }}/tls/{{ item.dest }}"
    remote_src: "{{ openbao_tls_remote_src }}"
    owner: root
    group: "{{ openbao_user }}"
    mode: "0644"
  loop:
    - { src: "{{ openbao_tls_cert_src }}", dest: server.pem }
    - { src: "{{ openbao_tls_ca_src }}", dest: ca.pem }
  notify: Restart openbao

- name: Copy TLS key
  ansible.builtin.copy:
    src: "{{ openbao_tls_key_src }}"
    dest: "{{ openbao_config_dir }}/tls/server.key"
    remote_src: "{{ openbao_tls_remote_src }}"
    owner: root
    group: "{{ openbao_user }}"
    mode: "0640"
  no_log: true
  notify: Restart openbao

- name: Create static unseal key
  ansible.builtin.shell:
    cmd: umask 077 && head -c 32 /dev/urandom > {{ openbao_static_key_file | quote }}
    creates: "{{ openbao_static_key_file }}"
  when: openbao_seal == 'static' and openbao_static_key_from in ['', inventory_hostname]

# Кластер: у всех узлов один ключ распечатывания (иначе присоединившийся узел не распечатает данные Raft).
- name: Check static unseal key
  ansible.builtin.stat:
    path: "{{ openbao_static_key_file }}"
  register: openbao_static_key_stat
  when: openbao_seal == 'static' and openbao_static_key_from not in ['', inventory_hostname]

- name: Read static unseal key of {{ openbao_static_key_from }}
  ansible.builtin.slurp:
    src: "{{ openbao_static_key_file }}"
  delegate_to: "{{ openbao_static_key_from }}"
  register: openbao_static_key_peer
  when: openbao_static_key_stat.stat is defined and not openbao_static_key_stat.stat.exists
  no_log: true

- name: Copy static unseal key from {{ openbao_static_key_from }}
  ansible.builtin.shell:
    cmd: umask 077 && base64 -d > {{ openbao_static_key_file | quote }}
    stdin: "{{ openbao_static_key_peer.content }}"
    creates: "{{ openbao_static_key_file }}"
  when: openbao_static_key_peer.content is defined
  no_log: true

- name: Restrict static unseal key
  ansible.builtin.file:
    path: "{{ openbao_static_key_file }}"
    owner: "{{ openbao_user }}"
    group: "{{ openbao_user }}"
    mode: "0400"
  when: openbao_seal == 'static'

- name: Allow PKCS#11 devices (TPM, HSM) for openbao.service
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ openbao_service }}.service.d/thepost-pkcs11.conf"
    content: |
      # PKCS#11 (TPM, HSM): пакетный юнит закрывает устройства (PrivateDevices=yes).
      [Service]
      PrivateDevices=no
    owner: root
    group: root
    mode: "0644"
  when: openbao_seal == 'pkcs11'
  notify: Restart openbao

- name: Write OpenBao configuration
  ansible.builtin.template:
    src: openbao.hcl.j2
    dest: "{{ openbao_config_dir }}/openbao.hcl"
    owner: root
    group: "{{ openbao_user }}"
    mode: "0640"
  notify: Restart openbao

- name: Start OpenBao
  ansible.builtin.systemd_service:
    name: "{{ openbao_service }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Set OpenBao CLI environment
  ansible.builtin.set_fact:
    openbao_cli_env:
      BAO_ADDR: "{{ openbao_api_addr }}"
      BAO_CACERT: "{{ openbao_config_dir }}/tls/ca.pem"

# /v1/sys/health: 200 — активен, 429 — резерв, 501 — не инициализирован, 503 — запечатан.
- name: Wait for OpenBao API
  ansible.builtin.uri:
    url: "{{ openbao_api_addr }}/v1/sys/health"
    ca_path: "{{ openbao_config_dir }}/tls/ca.pem"
    status_code: [200, 429, 501, 503]
  register: openbao_health
  until: openbao_health.status in [200, 429, 501, 503]
  retries: 30
  delay: 2

- name: Initialize OpenBao
  ansible.builtin.command:
    cmd: >-
      bao operator init -format=json
      -{{ 'key' if openbao_seal == 'shamir' else 'recovery' }}-shares={{ openbao_recovery_shares | int }}
      -{{ 'key' if openbao_seal == 'shamir' else 'recovery' }}-threshold={{ openbao_recovery_threshold | int }}
  environment: "{{ openbao_cli_env }}"
  register: openbao_init
  when: openbao_health.status == 501 and openbao_init_node
  changed_when: true
  no_log: true

- name: Save initialization result (recovery keys, root token)
  ansible.builtin.copy:
    content: "{{ openbao_init.stdout }}"
    dest: "{{ openbao_init_file }}"
    owner: root
    group: root
    mode: "0400"
  when: openbao_health.status == 501 and openbao_init_node
  no_log: true

- name: Remind about initialization result
  ansible.builtin.debug:
    msg: >-
      OpenBao инициализирован: ключи восстановления и root-токен — {{ openbao_init_file }} на {{ inventory_hostname }}.
      Перенесите их в надёжное место и удалите файл; дальнейшие прогоны — с openbao_admin_token.
  when: openbao_health.status == 501 and openbao_init_node

- name: Stop when OpenBao waits for manual unseal
  ansible.builtin.fail:
    msg: "OpenBao запечатан (seal shamir): bao operator unseal на каждом узле, затем повторите прогон"
  when: openbao_seal == 'shamir' and openbao_health.status != 200 and openbao_health.status != 429

# Узел кластера (не openbao_init_node): присоединяется к Raft через retry_join и распечатывается сам; KV, политику и
# AppRole настраивает узел инициализации.
- name: Wait for joining the Raft cluster
  ansible.builtin.uri:
    url: "{{ openbao_api_addr }}/v1/sys/health"
    ca_path: "{{ openbao_config_dir }}/tls/ca.pem"
    status_code: [200, 429, 501, 503]
  register: openbao_joined
  until: openbao_joined.status in [200, 429]
  retries: 60
  delay: 2
  when: not openbao_init_node

- name: Configure OpenBao for The Post
  ansible.builtin.include_tasks: configure.yml
  when: openbao_init_node
