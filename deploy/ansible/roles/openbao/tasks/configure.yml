# Настройка OpenBao для The Post на узле инициализации: KV, политика, AppRole thepost, пароли PostgreSQL, секреты
# служб инфраструктуры. Повторный прогон ничего не меняет.
---
- name: Read root token from initialization result
  ansible.builtin.slurp:
    src: "{{ openbao_init_file }}"
  register: openbao_init_saved
  when: openbao_admin_token | length == 0
  no_log: true

- name: Set admin token
  ansible.builtin.set_fact:
    openbao_cli_env: >-
      {{ openbao_cli_env | combine({'BAO_TOKEN': openbao_admin_token if openbao_admin_token | length > 0
         else (openbao_init_saved.content | b64decode | from_json).root_token}) }}
  no_log: true

# Распечатан и выбран активный узел Raft: сразу после перезапуска (например, перевыпуск сертификата thepost_pki)
# распечатанный узел до минуты без лидера (выборы Raft на медленном диске) — запись в KV и политики отклоняется.
- name: Wait for unseal
  ansible.builtin.command: bao status -format=json
  environment: "{{ openbao_cli_env }}"
  register: openbao_status
  until: openbao_status.rc == 0 and (openbao_status.stdout | from_json).leader_address | default('', true) | length > 0
  retries: 60
  delay: 2
  changed_when: false
  no_log: true

- name: Copy thepost policy
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../openbao/thepost-policy.hcl"
    dest: "{{ openbao_config_dir }}/thepost-policy.hcl"
    owner: root
    group: root
    mode: "0644"

- name: Configure KV, policy and AppRole thepost
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      changed=no
      if ! bao secrets list | grep -q '^thepost/'; then bao secrets enable -path=thepost -version=2 kv; changed=yes; fi
      bao policy write thepost {{ (openbao_config_dir ~ '/thepost-policy.hcl') | quote }} >/dev/null
      if ! bao auth list | grep -q '^approle/'; then bao auth enable approle; changed=yes; fi
      bao write auth/approle/role/thepost token_policies=thepost token_ttl={{ openbao_thepost_token_ttl | quote }} \
        token_max_ttl={{ openbao_thepost_token_max_ttl | quote }} secret_id_ttl=0 secret_id_num_uses=0 >/dev/null
      # Пароли учётных записей PostgreSQL (DEP-08): узел, владелец схемы, только чтение — случайные при создании.
      for s in {% for k, v in openbao_thepost_db_secrets.items() %}{{ (k ~ ':' ~ v) | quote }} {% endfor %}; do
        if ! bao kv get -mount=thepost "${s%%:*}" >/dev/null 2>&1; then
          head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' \
            | bao kv put -mount=thepost "${s%%:*}" username="${s#*:}" password=- >/dev/null
          changed=yes
        fi
      done
      echo "changed=$changed"
    executable: /bin/bash
  environment: "{{ openbao_cli_env }}"
  register: openbao_bootstrap
  changed_when: "'changed=yes' in openbao_bootstrap.stdout"
  no_log: true

- name: AppRole thepost on this VM
  ansible.builtin.include_tasks: approle.yml
  vars:
    openbao_approle_from: "{{ inventory_hostname }}"
  when: openbao_thepost_local

- name: Read PostgreSQL passwords
  ansible.builtin.command: bao kv get -mount=thepost -field=password {{ item | quote }}
  environment: "{{ openbao_cli_env }}"
  loop: "{{ openbao_thepost_db_secrets.keys() | list }}"
  register: openbao_db_passwords
  changed_when: false
  no_log: true

# Для роли PostgreSQL (DEP-05, DEP-08): учётные записи узла, владельца схемы и только чтения.
- name: Expose PostgreSQL passwords for the PostgreSQL role
  ansible.builtin.set_fact:
    thepost_db_password: "{{ (openbao_db_passwords.results | selectattr('item', 'eq', 'db') | first).stdout }}"
    thepost_db_owner_password: "{{ (openbao_db_passwords.results | selectattr('item', 'eq', 'db-owner') | first).stdout }}"
    thepost_db_readonly_password: >-
      {{ (openbao_db_passwords.results | selectattr('item', 'eq', 'db-readonly') | first).stdout }}
  no_log: true

# Секреты служб инфраструктуры (малый Enterprise: pg_auto_failover, SeaweedFS) — отдельный KV {{ openbao_infra_mount }},
# политике thepost недоступен: путь → поля, значения случайные при создании; факт openbao_infra — для других ролей.
- name: Enable KV {{ openbao_infra_mount }}
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      if ! bao secrets list | grep -q '^{{ openbao_infra_mount }}/'; then
        bao secrets enable -path={{ openbao_infra_mount | quote }} -version=2 kv >/dev/null
        echo changed
      fi
    executable: /bin/bash
  environment: "{{ openbao_cli_env }}"
  register: openbao_infra_mount_enable
  changed_when: "'changed' in openbao_infra_mount_enable.stdout"
  when: openbao_infra_secrets | length > 0
  no_log: true

- name: Generate infrastructure secrets
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      if ! bao kv get -mount={{ openbao_infra_mount | quote }} {{ item.key | quote }} >/dev/null 2>&1; then
        args=()
        for f in {{ item.value | map('quote') | join(' ') }}; do
          args+=("$f=$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')")
        done
        bao kv put -mount={{ openbao_infra_mount | quote }} {{ item.key | quote }} "${args[@]}" >/dev/null
        echo changed
      fi
    executable: /bin/bash
  environment: "{{ openbao_cli_env }}"
  loop: "{{ openbao_infra_secrets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: openbao_infra_bootstrap
  changed_when: "'changed' in openbao_infra_bootstrap.stdout"
  no_log: true

- name: Read infrastructure secrets
  ansible.builtin.command: bao kv get -mount={{ openbao_infra_mount | quote }} -format=json {{ item | quote }}
  environment: "{{ openbao_cli_env }}"
  loop: "{{ openbao_infra_secrets.keys() | list }}"
  register: openbao_infra_read
  changed_when: false
  no_log: true

- name: Expose infrastructure secrets
  ansible.builtin.set_fact:
    openbao_infra: >-
      {{ dict(openbao_infra_read.results | map(attribute='item')
         | zip(openbao_infra_read.results | map(attribute='stdout') | map('from_json') | map(attribute='data.data'))) }}
  when: openbao_infra_secrets | length > 0
  no_log: true

- name: Warn about unseal key in file
  ansible.builtin.debug:
    msg: >-
      Ключ распечатывания OpenBao — в файле {{ openbao_static_key_file }}: секреты защищены слабее, чем с TPM/HSM
      (openbao_seal: pkcs11) или KMS. thepost doctor выдаёт предупреждение.
  when: openbao_seal == 'static'
