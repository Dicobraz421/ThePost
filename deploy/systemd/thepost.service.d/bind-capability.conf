# Запуск без активации сокетов (юниты thepost-*.socket не включены): процесс сам слушает порты ниже 1024
# (25, 465, 587, 143, 993, 443), ему нужна CAP_NET_BIND_SERVICE — единственная допустимая capability (SRS 2.7).
# Установка: /etc/systemd/system/thepost.service.d/bind-capability.conf, затем systemctl daemon-reload.
# Capability действует только в пространстве пользователей хоста — PrivateUsers= выключается.
[Service]
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
PrivateUsers=no
