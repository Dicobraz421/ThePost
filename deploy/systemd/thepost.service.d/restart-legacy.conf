# The Post: постоянная пауза перезапуска 30 с для systemd < 254 (решение 85) — растущей паузы
# (RestartSteps, RestartMaxDelaySec) там нет. На systemd 254+ этот файл не нужен: пауза растёт с 10 с до 5 мин.
# Установка: /etc/systemd/system/thepost.service.d/restart-legacy.conf, затем systemctl daemon-reload.
[Service]
RestartSec=30s
