# Конфигурация thepost для профиля smb в compose (эталон — deploy/config/all.yaml).
domain: example.test
# Узел входит ролью thepost (член thepost_app, не владелец схемы, без SUPERUSER и BYPASSRLS); миграции — от владельца
# схемы thepost_owner (postgres-role-tls, DEP-08). Пароли — только из OpenBao.
database:
  url: postgres://thepost@postgres-tls:5432/thepost?sslmode=verify-full&sslrootcert=/etc/thepost/tls/ca.pem
  password: { secret: "thepost/db#password" }
  owner:
    user: thepost_owner
    password: { secret: "thepost/db-owner#password" }
blob:
  url: file:///var/lib/thepost/blob
roles: [all]

# Сертификат клиентских протоколов (SMTP, IMAP, JMAP): fullchain.pem и privkey.pem выпускает tls-init
# (tls/gen-certs.sh, владелец ключа — nonroot 65532), SAN — localhost, thepost, mail.example.test.
tls:
  cert_file: /etc/thepost/tls/fullchain.pem
  key_file: /etc/thepost/tls/privkey.pem

# Слушатели — на все адреса контейнера (IPv4: в контейнере Docker IPv6 по умолчанию выключен).
# Порты хоста — в dev.yml (TP_SMTP_PORT и т. п.).
# Admin API — только внутренний адрес (SRS 6.8): loopback контейнера, на хост не публикуется.
http:
  jmap: { listen: "0.0.0.0:443" }
  admin: { listen: "127.0.0.1:8443" }
imap:
  listeners:
    - listen: "0.0.0.0:143"
    - listen: "0.0.0.0:993"
      implicit_tls: true
smtp:
  hostname: mail.example.test
  inbound:
    - listen: "0.0.0.0:25"
  submission:
    - listen: "0.0.0.0:587"
    - listen: "0.0.0.0:465"
      implicit_tls: true
  delivery:
    local_domains: [example.test]

# Хранилище секретов (OpenBao, только TLS); вход AppRole — role_id и secret_id выдаёт openbao-init-tls.
# Поля секции — по PLT-12.
secrets:
  url: https://openbao-tls:8200
  tls:
    ca_file: /etc/thepost/tls/ca.pem
  auth:
    approle:
      role_id_file: /etc/thepost/openbao/role_id
      secret_id_file: /etc/thepost/openbao/secret_id
