# Release-сборка thepost (решение 116, CI-14) — единственный путь: артефакт CI (ci.yml, release), выпуск и repro
# (beta.yml). cross (образ glibc) под базовый x86-64 без AVX2; затем запуск x86_64 на эмуляции старого процессора
# (qemu-user, Nehalem = x86-64-v2, без AVX): инструкции новее базового уровня — SIGILL, сборка падает.
# Нативная сборка на ubuntu-latest дала C-код aws-lc-sys и ring под x86-64-v3, бинарь падал на стенде без AVX2.
# RUSTFLAGS сборки пустые в любом workflow (в ci.yml — `-D warnings`): бинарь CI совпадает с бинарём беты.
name: release-build
description: cross build --release thepost и запуск на старом процессоре

inputs:
  target:
    description: Цель rustc (x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu)
    required: true
  cache:
    description: rust-cache ('false' — сборка с нуля, repro)
    default: 'true'
  save-cache:
    description: Сохранять rust-cache
    default: 'true'

outputs:
  binary:
    description: Путь к бинарю
    value: target/${{ inputs.target }}/release/thepost

runs:
  using: composite
  steps:
    # Ключ cross-*: прежние кэши (release — нативная сборка под x86-64-v3) не подхватываются.
    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@v2.9.3
      with:
        shared-key: cross-${{ inputs.target }}
        save-if: ${{ inputs.save-cache }}
    - uses: taiki-e/install-action@v2.90.3
      with:
        tool: cross
    - id: console
      uses: ./.github/actions/console
    - name: cross build
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        ARGS: ${{ steps.console.outputs.cargo-args }}
        RUSTFLAGS: ''
      run: cross build --release --locked -p thepost --target "$TARGET" $ARGS
    - name: Запуск на старом процессоре (qemu Nehalem, без AVX)
      if: inputs.target == 'x86_64-unknown-linux-gnu'
      shell: bash
      env:
        BIN: target/${{ inputs.target }}/release/thepost
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends qemu-user >/dev/null
        qemu-x86_64 -cpu Nehalem "$BIN" --version && exit 0
        set +e  # ВРЕМЕННО (разбор CI-14): где падает и на каком уровне проходит.
        sudo apt-get install -y -qq --no-install-recommends binutils >/dev/null || true
        for cpu in Nehalem,+aes Westmere Westmere,-aes SandyBridge Haswell max; do
          echo "== $cpu"; qemu-x86_64 -cpu "$cpu" "$BIN" --version; echo "rc=$?"
        done
        qemu-x86_64 -cpu Nehalem -d in_asm,nochain -D /tmp/q.log "$BIN" --version || true
        echo "== последние блоки"; tail -n 40 /tmp/q.log
        pc=$(grep -oE '^0x[0-9a-f]+' /tmp/q.log | tail -n1)
        echo "pc=$pc"; nm -n --defined-only "$BIN" 2>/dev/null | wc -l
        curl -fsSL -o /tmp/b.tgz https://github.com/Dicobraz421/ThePost/releases/download/beta-20261112/thepost-beta-20261112-x86_64-unknown-linux-gnu.tar.gz
        tar -C /tmp -xzf /tmp/b.tgz
        echo "== бета под Nehalem"; qemu-x86_64 -cpu Nehalem /tmp/thepost-beta-20261112-x86_64-unknown-linux-gnu/thepost --version; echo "rc=$?"
        echo "== бета под Nehalem,+aes"; qemu-x86_64 -cpu Nehalem,+aes /tmp/thepost-beta-20261112-x86_64-unknown-linux-gnu/thepost --version; echo "rc=$?"
        qemu-x86_64 -cpu Nehalem -d in_asm,nochain -D /tmp/qb.log /tmp/thepost-beta-20261112-x86_64-unknown-linux-gnu/thepost --version || true
        echo "== бета последние блоки"; tail -n 30 /tmp/qb.log
        exit 1
