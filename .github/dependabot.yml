# Свежие версии всего, от чего зависит сборка (решение владельца 2026-11-12):
# раз в неделю — одно сводное PR на экосистему (мелкие и патч-версии), крупные — отдельными PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/console"]
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: ci, include: scope }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      cargo: { patterns: ["*"], update-types: [minor, patch] }
    open-pull-requests-limit: 2
    commit-message: { prefix: build, include: scope }
  - package-ecosystem: npm
    directory: /console
    schedule: { interval: weekly, day: monday }
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }
    # react-router 8 несовместим с @refinedev/react-router 2.x (peer ^7, две копии роутера — консоль не работает,
    # #452 закрыт после теста). Снять, когда адаптер Refine поддержит 8.
    ignore:
      - dependency-name: react-router
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 2
    commit-message: { prefix: build, include: scope }
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }
