# Ночной фаззинг The Post (CI-04, SRS 6.8): все цели cargo-fuzz крейтов (crates/*/fuzz) по 10 минут.
# Цели берутся из [[bin]] в crates/*/fuzz/Cargo.toml — новая цель попадает в прогон сама.
# Корпус каждой цели — в кэше Actions (восстановление по префиксу, сохранение и при падении).
# Падение цели — issue «fuzz: <крейт>/<цель>» с входом и командой воспроизведения; открытый issue той же цели
# получает комментарий вместо нового. На PR не запускается (бюджет CI ≤7 мин).
# Начальный корпус tp-sieve (CI-09) — .github/fuzz-seeds/tp-sieve.
# Сборка `-O`: проверки отладки и переполнений задаёт [profile.release] в fuzz/Cargo.toml крейта.
name: Fuzz

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC, после беты
  workflow_dispatch:
    inputs:
      seconds:
        description: Время на цель, секунд
        default: '600'

concurrency:
  group: fuzz
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Готовый cargo-fuzz из install-action собран под musl и по умолчанию берёт свою платформу как цель сборки;
  # санитайзеру нужен glibc (CI-09).
  FUZZ_TRIPLE: x86_64-unknown-linux-gnu

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.t.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: t
        name: Цели cargo-fuzz
        shell: bash
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import glob, json, os, tomllib
          m = []
          for p in sorted(glob.glob("crates/*/fuzz/Cargo.toml")):
              crate = os.path.dirname(os.path.dirname(p))
              with open(p, "rb") as f:
                  bins = tomllib.load(f).get("bin", [])
              m += [{"crate": crate, "name": os.path.basename(crate), "target": b["name"]} for b in bins]
          print("matrix=" + json.dumps(m))
          EOF
          cat "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    if: needs.targets.outputs.matrix != '[]'
    name: fuzz ${{ matrix.name }}/${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.crate }}
    env:
      TARGET: ${{ matrix.target }}
      SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-fuzz
      # rust-cache не нужен: nightly обновляется ежедневно, кэш сборки к следующей ночи устаревает.
      - name: Корпус из кэша
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.name }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.name }}-${{ matrix.target }}-
      - id: build
        run: cargo +nightly fuzz build -O --target "$FUZZ_TRIPLE" "$TARGET"
      - id: run
        name: Фаззинг
        run: |
          set -o pipefail
          mkdir -p "fuzz/corpus/$TARGET"
          seeds=()
          # MS-13: начальный корпус — письма KIT-04 (см. crates/tp-mailstore/fuzz/Cargo.toml).
          if [ "${{ matrix.name }}" = tp-mailstore ]; then seeds+=(../tp-testkit/corpus); fi
          # CI-09: начальный корпус Sieve — скрипты из тестов; для run — скрипт и письмо KIT-04 через байт NUL.
          if [ "${{ matrix.name }}" = tp-sieve ]; then
            s="$RUNNER_TEMP/seeds"
            mkdir -p "$s"
            for f in "$GITHUB_WORKSPACE"/.github/fuzz-seeds/tp-sieve/*.sieve; do
              if [ "$TARGET" = run ]; then
                for m in ../tp-testkit/corpus/0[1-5]-*.eml; do
                  { cat "$f"; printf '\0'; cat "$m"; } > "$s/$(basename "$f" .sieve)-$(basename "$m" .eml)"
                done
              else
                cp "$f" "$s/"
              fi
            done
            seeds+=("$s")
          fi
          cargo +nightly fuzz run -O --target "$FUZZ_TRIPLE" "$TARGET" "fuzz/corpus/$TARGET" "${seeds[@]}" -- \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=30 -print_final_stats=1 2>&1 | tee "$RUNNER_TEMP/fuzz.log"
      - name: Корпус в кэш
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.name }}-${{ matrix.target }}-${{ github.run_id }}
      - name: Артефакт падения
        if: failure() && steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-${{ matrix.name }}-${{ matrix.target }}
          path: |
            ${{ matrix.crate }}/fuzz/artifacts/${{ matrix.target }}
            ${{ runner.temp }}/fuzz.log
          if-no-files-found: ignore
      - name: Issue о падении
        if: failure() && (steps.build.outcome == 'failure' || steps.run.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CRATE: ${{ matrix.crate }}
          NAME: ${{ matrix.name }}
          BUILD: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="fuzz: $NAME/$TARGET"
          art=$(ls -1t "fuzz/artifacts/$TARGET"/* 2>/dev/null | head -n1 || true)
          {
            echo "Ночной фаззинг (CI-04): цель \`$TARGET\` крейта \`$NAME\`, коммит $GITHUB_SHA, [прогон]($RUN_URL)."
            echo
            if [ "$BUILD" = failure ]; then
              echo "Цель не собралась — журнал сборки в прогоне."
            elif [ -n "$art" ]; then
              f=$(basename "$art")
              echo "### Воспроизведение"
              echo
              echo "Вход \`$f\` ($(stat -c %s "$art") байт) — в артефакте прогона \`fuzz-$NAME-$TARGET\`."
              echo
              echo '```sh'
              echo "cd $CRATE"
              if [ "$(stat -c %s "$art")" -le 8192 ]; then
                echo "base64 -d > $f <<'B64'"
                base64 -w 76 "$art"
                echo "B64"
              fi
              echo "cargo +nightly fuzz run -O $TARGET $f"
              echo '```'
            else
              echo "Прогон упал без входа в fuzz/artifacts — см. журнал."
            fi
            if [ -s "$RUNNER_TEMP/fuzz.log" ]; then
              # Сообщение паники стоит выше трассы и в хвост не попадает (CI-09).
              if grep -q -m1 'panicked at' "$RUNNER_TEMP/fuzz.log"; then
                echo
                echo "### Паника"
                echo
                echo '```'
                grep -m1 -A3 'panicked at' "$RUNNER_TEMP/fuzz.log" | cut -c1-300
                echo '```'
              fi
              echo
              echo "### Журнал (хвост)"
              echo
              echo '```'
              tail -n 60 "$RUNNER_TEMP/fuzz.log" | cut -c1-300
              echo '```'
            fi
          } > "$RUNNER_TEMP/issue.md"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
