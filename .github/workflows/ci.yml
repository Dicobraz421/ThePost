# CI The Post (процесс pets-dev). PR и merge queue ≤7 мин; docs-PR без сборки.
# Required check в защите main — один: `gate`. Release — только main, бета (тег beta-*) и ручной запуск.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ['beta-*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      deps: ${{ steps.d.outputs.deps }}
      console: ${{ steps.d.outputs.console }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: d
        name: Что изменилось
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$BASE" ]; then
            echo rust=true >> "$GITHUB_OUTPUT"; echo deps=true >> "$GITHUB_OUTPUT"
            if [ -f console/package-lock.json ]; then echo console=true; else echo console=false; fi >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # pull_request: HEAD — пробный мерж с main; base.sha в событии отстаёт, если main ушёл вперёд,
          # и в изменения попадают чужие файлы. Первый родитель мержа — тот main, с которым сливали.
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify HEAD^2 >/dev/null; then BASE=$(git rev-parse HEAD^1); fi
          git diff --name-only "$BASE" HEAD > changed.txt
          cat changed.txt
          if [ "$EVENT" = pull_request ]; then
            python3 .github/lane_check.py lanes.toml changed.txt "$HEAD_REF"
          fi
          # Веб-консоль (console/) Rust не трогает: её проверяет job console (CI-06).
          if grep -qvE '^(docs/|console/|[^/]*\.md$|.*/README\.md$)' changed.txt; then
            echo rust=true >> "$GITHUB_OUTPUT"
          else
            echo rust=false >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '(^|/)Cargo\.(toml|lock)$|^deny\.toml$' changed.txt; then
            echo deps=true >> "$GITHUB_OUTPUT"
          else
            echo deps=false >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(console/|\.github/actions/console/)' changed.txt; then
            echo console=true >> "$GITHUB_OUTPUT"
          else
            echo console=false >> "$GITHUB_OUTPUT"
          fi

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo fmt --all --check

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    # Сервисы CI — профиль dev: открытые каналы на localhost раннера (TLS — профиль по умолчанию).
    # Valkey исключён из поставки (решение 2026-11-01, CLU-09): сервиса нет.
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --profile ci --no-tests=pass
      - run: cargo test --doc --workspace --locked

  # Поставка без интерпретаторов (решение 2026-11-01, SRS 7.2; CI-05): самопроверка interp_check.py и базовый
  # образ последней стадии deploy/docker/Dockerfile. Готовый образ и архивы проверяет beta.yml до публикации.
  interp:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 .github/interp_check.py --self-test
      - name: Базовый образ поставки
        shell: bash
        run: |
          base=$(grep -E '^FROM ' deploy/docker/Dockerfile | tail -n1 | awk '{print $2}')
          echo "база: $base"
          case "$base" in *'$'*|'') echo "::error::база последней стадии не разобрана: '$base'"; exit 1;; esac
          docker pull -q "$base"
          id=$(docker create "$base" none)  # команда не запускается: в distroless нет CMD
          docker export "$id" | python3 .github/interp_check.py -
          echo "base=$base" >> "$GITHUB_ENV"
      - name: Подложенный в образ сценарий находится
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          printf '#!/bin/sh\necho\n' > hook.sh
          printf 'FROM %s\nCOPY hook.sh /usr/local/bin/hook\n' "$base" > Dockerfile
          docker build -q -t interp-neg .
          id=$(docker create interp-neg none)
          out=$(docker export "$id" | python3 "$GITHUB_WORKSPACE/.github/interp_check.py" - || true)
          echo "${out//::error::/}"
          grep -q 'usr/local/bin/hook: сценарий' <<< "$out" || { echo "::error::подложенный сценарий не найден"; exit 1; }

  deny:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny --locked check licenses bans sources
      # cargo-audit (SRS 6.8, CI-03, DEPS-01, DEPS-02): уязвимости RustSec в Cargo.lock. Пропуск — только известный:
      # libsqlite3-sys <0.39 (RUSTSEC-2026-0459, CVE SQLite) — только запись в Cargo.lock через sqlx-sqlite 0.9.0
      # (требует <0.38, в сборку не входит), ждём выпуска sqlx-sqlite на libsqlite3-sys >=0.39. Новые — валят job.
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2026-0459

  # Веб-консоль (CI-06, SRS 5.2): Node LTS, npm ci по lock-файлу, типы, линтер, vitest, npm audit, лицензии
  # по deny.toml, npm run build — шаги в .github/actions/console. Только при изменениях console/**.
  console:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/console
        with:
          checks: 'true'

  # Только main, бета и ручной запуск: release-сборка и артефакт (решение 116, CI-14) — тем же путём, что выпуск
  # в beta.yml (.github/actions/release-build: cross, запуск на qemu Nehalem). В PR не выполняется.
  release:
    needs: [changes, test]
    if: >-
      !cancelled() && needs.test.result != 'failure' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - id: build
        uses: ./.github/actions/release-build
        with:
          target: x86_64-unknown-linux-gnu
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: thepost-linux-x86_64
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error

  # Единственный required check: зелёный, если всё нужное прошло или было пропущено.
  gate:
    needs: [changes, fmt, clippy, test, interp, deny, console]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          r='${{ join(needs.*.result, ' ') }}'
          echo "$r"
          case " $r " in *" failure "*|*" cancelled "*) exit 1;; esac
