# CI The Post (процесс pets-dev). PR и merge queue ≤7 мин; docs-PR без сборки.
# Required check в защите main — один: `gate`. Release — только main, бета (тег beta-*) и ручной запуск.
name: CI

on:
  pull_request:
    # labeled/unlabeled — метка owner-review перезапускает gate (решение владельца 2026-11-14).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
    tags: ['beta-*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      deps: ${{ steps.d.outputs.deps }}
      console: ${{ steps.d.outputs.console }}
      design: ${{ steps.d.outputs.design }}
      openapi: ${{ steps.d.outputs.openapi }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: d
        name: Что изменилось
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$BASE" ]; then
            echo rust=true >> "$GITHUB_OUTPUT"; echo deps=true >> "$GITHUB_OUTPUT"; echo design=true >> "$GITHUB_OUTPUT"
            # Сверка схемы с копией консоли — только PR и очередь (CI-11): расхождение не валит main и артефакт release.
            echo openapi=false >> "$GITHUB_OUTPUT"
            if [ -f console/package-lock.json ]; then echo console=true; else echo console=false; fi >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # pull_request: HEAD — пробный мерж с main; base.sha в событии отстаёт, если main ушёл вперёд,
          # и в изменения попадают чужие файлы. Первый родитель мержа — тот main, с которым сливали.
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify HEAD^2 >/dev/null; then BASE=$(git rev-parse HEAD^1); fi
          git diff --name-only "$BASE" HEAD > changed.txt
          cat changed.txt
          if [ "$EVENT" = pull_request ]; then
            python3 .github/lane_check.py lanes.toml changed.txt "$HEAD_REF"
          fi
          # Веб-консоль (console/) Rust не трогает: её проверяет job console (CI-06). Кроме копии схемы Admin API:
          # её сверяет со схемой бинарного файла job test (CI-11).
          if grep -qvE '^(docs/|console/|[^/]*\.md$|.*/README\.md$)' changed.txt \
            || grep -qx 'console/src/api/openapi.json' changed.txt; then
            echo rust=true >> "$GITHUB_OUTPUT"
          else
            echo rust=false >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '(^|/)Cargo\.(toml|lock)$|^deny\.toml$' changed.txt; then
            echo deps=true >> "$GITHUB_OUTPUT"
          else
            echo deps=false >> "$GITHUB_OUTPUT"
          fi
          # Токены фирменного стиля (DES-01): консоль читает design/ при сборке (UI-19) — правка design/ запускает и
          # job console; tp-tui читает их include_str! (TUI-06) — Rust тоже собирается.
          if grep -qE '^(console/|\.github/actions/console/|design/)' changed.txt; then
            echo console=true >> "$GITHUB_OUTPUT"
          else
            echo console=false >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(design/|scripts/design_contrast\.py$)' changed.txt; then
            echo design=true >> "$GITHUB_OUTPUT"
          else
            echo design=false >> "$GITHUB_OUTPUT"
          fi
          # Схема Admin API (utoipa) — только в tp-admin; копия консоли — console/src/api/openapi.json.
          if grep -qE '^(crates/tp-admin/|console/src/api/openapi\.json$)' changed.txt; then
            echo openapi=true >> "$GITHUB_OUTPUT"
          else
            echo openapi=false >> "$GITHUB_OUTPUT"
          fi

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo fmt --all --check

  # Фича gssapi (решение 107, CI-12) — как в выпуске: код Kerberos проверяется на каждом PR. libgssapi-sys нужны
  # заголовки libkrb5 и libclang (bindgen). Тесты — без фичи: механизм с системной Kerberos проверяется вручную (AUTH-05).
  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: libkrb5 и libclang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libkrb5-dev libclang-dev >/dev/null
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked --features thepost/gssapi

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    # Сервисы CI — профиль dev: открытые каналы на localhost раннера (TLS — профиль по умолчанию).
    # Valkey исключён из поставки (решение 2026-11-01, CLU-09): сервиса нет.
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --profile ci --no-tests=pass
      - run: cargo test --doc --workspace --locked
      # Схема Admin API = копия консоли (решение 74, CI-11): `thepost admin openapi` (APP-37, без узла) — бинарь,
      # собранный nextest для интеграционных тестов thepost, без отдельной сборки. Сравнение — по содержанию (jq -S):
      # копию снимают и `curl` с узла (console/README.md), порядок ключей там не алфавитный. Свежая схема при
      # расхождении — артефакт openapi.json.
      - id: openapi
        name: Схема Admin API = console/src/api/openapi.json
        if: needs.changes.outputs.openapi == 'true'
        shell: bash
        run: |
          bin=target/debug/thepost
          [ -x "$bin" ] || { echo "::error::$bin не собран nextest — сверять схему нечем"; exit 1; }
          "$bin" admin openapi -o "$RUNNER_TEMP/openapi.json"
          if ! diff -u --label console/src/api/openapi.json --label 'thepost admin openapi' \
            <(jq -S . console/src/api/openapi.json) <(jq -S . "$RUNNER_TEMP/openapi.json"); then
            echo "::error file=console/src/api/openapi.json::схема Admin API разошлась с копией консоли —" \
              "перегенерировать схему консоли: thepost admin openapi -o console/src/api/openapi.json," \
              "затем (cd console && npm run gen:api)"
            exit 1
          fi
          echo "схема Admin API совпадает с console/src/api/openapi.json"
      - if: failure() && steps.openapi.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: openapi.json
          path: ${{ runner.temp }}/openapi.json

  # Поставка без интерпретаторов (решение 2026-11-01, SRS 7.2; CI-05): самопроверка interp_check.py и базовый
  # образ последней стадии deploy/docker/Dockerfile. Готовый образ и архивы проверяет beta.yml до публикации.
  interp:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 .github/interp_check.py --self-test
      - name: Базовый образ поставки
        shell: bash
        run: |
          base=$(grep -E '^FROM ' deploy/docker/Dockerfile | tail -n1 | awk '{print $2}')
          echo "база: $base"
          case "$base" in *'$'*|'') echo "::error::база последней стадии не разобрана: '$base'"; exit 1;; esac
          docker pull -q "$base"
          id=$(docker create "$base" none)  # команда не запускается: в distroless нет CMD
          docker export "$id" | python3 .github/interp_check.py -
          echo "base=$base" >> "$GITHUB_ENV"
      - name: Подложенный в образ сценарий находится
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          printf '#!/bin/sh\necho\n' > hook.sh
          printf 'FROM %s\nCOPY hook.sh /usr/local/bin/hook\n' "$base" > Dockerfile
          docker build -q -t interp-neg .
          id=$(docker create interp-neg none)
          out=$(docker export "$id" | python3 "$GITHUB_WORKSPACE/.github/interp_check.py" - || true)
          echo "${out//::error::/}"
          grep -q 'usr/local/bin/hook: сценарий' <<< "$out" || { echo "::error::подложенный сценарий не найден"; exit 1; }

  deny:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny --locked check licenses bans sources
      # cargo-audit (SRS 6.8, CI-03, DEPS-01, DEPS-02): уязвимости RustSec в Cargo.lock. Пропуск — только известный:
      # libsqlite3-sys <0.39 (RUSTSEC-2026-0459, CVE SQLite) — только запись в Cargo.lock через sqlx-sqlite 0.9.0
      # (требует <0.38, в сборку не входит), ждём выпуска sqlx-sqlite на libsqlite3-sys >=0.39. Новые — валят job.
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2026-0459

  # Веб-консоль (CI-06, SRS 5.2): Node LTS, npm ci по lock-файлу, типы, линтер, vitest, npm audit, лицензии
  # по deny.toml, npm run build — шаги в .github/actions/console. Только при изменениях console/**.
  console:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/console
        with:
          checks: 'true'

  # Фирменный стиль (решение 119, DES-01): контраст пар ролей design/tokens.toml в каждом режиме и у CLI.
  # Самопроверка — скрипт находит нарушения в испорченных токенах.
  design:
    needs: changes
    if: needs.changes.outputs.design == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/design_contrast.py --self-test
      - run: python3 scripts/design_contrast.py design/tokens.toml

  # Только main, бета и ручной запуск: release-сборка и артефакт (решение 116, CI-14) — тем же путём, что выпуск
  # в beta.yml (.github/actions/release-build: cross, запуск на qemu Nehalem). В PR не выполняется.
  release:
    needs: [changes, test]
    if: >-
      !cancelled() && needs.test.result != 'failure' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - id: build
        uses: ./.github/actions/release-build
        with:
          target: x86_64-unknown-linux-gnu
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          console-archive: thepost-console
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: thepost-linux-x86_64
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error
      # Архив веб-консоли (CI-10), как в бете: console/dist, вшитая в этот бинарь.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: thepost-console
          path: |
            ${{ steps.build.outputs.console-archive }}
            ${{ steps.build.outputs.console-archive }}.sha256
          if-no-files-found: error

  # Единственный required check: зелёный, если всё нужное прошло или было пропущено.
  gate:
    needs: [changes, fmt, clippy, test, interp, deny, console, design]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          r='${{ join(needs.*.result, ' ') }}'
          echo "$r"
          # Ручной стоп владельца (решение 2026-11-14): метка owner-review — PR ждёт владельца; снять метку — gate заново.
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'owner-review') }}" = true ]; then
            echo "::error::метка owner-review — PR ждёт решения владельца"; exit 1
          fi
          case " $r " in *" failure "*|*" cancelled "*) exit 1;; esac
