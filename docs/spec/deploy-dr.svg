<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#404040"/></marker></defs>
<rect width="1000" height="560" fill="#FFFFFF"/>
<text x="500.0" y="26" font-size="16" text-anchor="middle" fill="#1F4E79" font-weight="bold">DR active-passive: основная и резервная площадки</text>
<rect x="20" y="50" width="450" height="440" rx="8" fill="#F5F9FD" stroke="#1F4E79" stroke-width="1.6"/>
<text x="32" y="70" font-size="13" text-anchor="start" fill="#1F4E79" font-weight="bold">Площадка A (основная)</text>
<rect x="530" y="50" width="450" height="440" rx="8" fill="#F5F9FD" stroke="#1F4E79" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="542" y="70" font-size="13" text-anchor="start" fill="#1F4E79" font-weight="bold">Площадка B (резервная)</text>
<rect x="40" y="85" width="410" height="54" rx="6" fill="#DCE9F5" stroke="#2E75B6" stroke-width="1.5"/>
<text x="245.0" y="102" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Узлы The Post</text>
<text x="245.0" y="117" font-size="10.5" text-anchor="middle" fill="#262626">edge, transport, access, backend</text>
<text x="245.0" y="131" font-size="10.5" text-anchor="middle" fill="#262626">по схеме Enterprise-ВМ или K8s</text>
<rect x="40" y="175" width="410" height="40" rx="6" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.5"/>
<text x="245.0" y="192" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">PostgreSQL</text>
<text x="245.0" y="207" font-size="10.5" text-anchor="middle" fill="#262626">primary + синхронные реплики площадки</text>
<rect x="40" y="250" width="410" height="40" rx="6" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.5"/>
<text x="245.0" y="267" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">SeaweedFS</text>
<text x="245.0" y="282" font-size="10.5" text-anchor="middle" fill="#262626">основная копия BLOB</text>
<rect x="40" y="325" width="410" height="40" rx="6" fill="#E2F0D9" stroke="#548235" stroke-width="1.5"/>
<text x="245.0" y="342" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">OpenBao</text>
<text x="245.0" y="357" font-size="10.5" text-anchor="middle" fill="#262626">кластер площадки</text>
<rect x="550" y="85" width="410" height="54" rx="6" fill="#DCE9F5" stroke="#2E75B6" stroke-width="1.5"/>
<text x="755.0" y="102" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Узлы The Post</text>
<text x="755.0" y="117" font-size="10.5" text-anchor="middle" fill="#262626">установлены и настроены, остановлены</text>
<text x="755.0" y="131" font-size="10.5" text-anchor="middle" fill="#262626">запускаются при переключении</text>
<rect x="550" y="175" width="410" height="54" rx="6" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.5"/>
<text x="755.0" y="192" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">PostgreSQL</text>
<text x="755.0" y="207" font-size="10.5" text-anchor="middle" fill="#262626">асинхронная реплика или реплика-кластер</text>
<text x="755.0" y="221" font-size="10.5" text-anchor="middle" fill="#262626">повышается при переключении</text>
<rect x="550" y="250" width="410" height="40" rx="6" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.5"/>
<text x="755.0" y="267" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">SeaweedFS</text>
<text x="755.0" y="282" font-size="10.5" text-anchor="middle" fill="#262626">копия BLOB: filer.sync, асинхронно</text>
<rect x="550" y="325" width="410" height="40" rx="6" fill="#E2F0D9" stroke="#548235" stroke-width="1.5"/>
<text x="755.0" y="342" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">OpenBao</text>
<text x="755.0" y="357" font-size="10.5" text-anchor="middle" fill="#262626">копия секретов (снимки Raft)</text>
<path d="M450,195 L550,195" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#a)"/>
<text x="500" y="188" font-size="10" text-anchor="middle" fill="#404040" font-style="italic">поток WAL</text>
<path d="M450,270 L550,270" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#a)"/>
<text x="500" y="263" font-size="10" text-anchor="middle" fill="#404040" font-style="italic">асинхронно</text>
<path d="M450,345 L550,345" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#a)"/>
<text x="500" y="338" font-size="10" text-anchor="middle" fill="#404040" font-style="italic">снимки</text>
<rect x="40" y="400" width="410" height="54" rx="6" fill="#EDEDED" stroke="#7F7F7F" stroke-width="1.5"/>
<text x="245.0" y="417" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Переключение — по процедуре</text>
<text x="245.0" y="432" font-size="10.5" text-anchor="middle" fill="#262626">повысить PostgreSQL и SeaweedFS на B,</text>
<text x="245.0" y="446" font-size="10.5" text-anchor="middle" fill="#262626">запустить узлы, переключить DNS и MX</text>
<rect x="550" y="400" width="410" height="54" rx="6" fill="#EDEDED" stroke="#7F7F7F" stroke-width="1.5"/>
<text x="755.0" y="417" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Модуль «Геораспределение» (опция)</text>
<text x="755.0" y="432" font-size="10.5" text-anchor="middle" fill="#262626">подтверждение доставки после</text>
<text x="755.0" y="446" font-size="10.5" text-anchor="middle" fill="#262626">репликации BLOB на B</text>
<text x="500" y="520" font-size="11" text-anchor="middle" fill="#404040" font-style="italic">RPO — отставание асинхронной репликации (с модулем — 0 для тел писем); RTO — длительность процедуры</text>
<rect x="20" y="532" width="14" height="12" rx="2" fill="#DCE9F5" stroke="#2E75B6"/>
<text x="40" y="542" font-size="10.5" fill="#404040">узел The Post</text>
<rect x="170" y="532" width="14" height="12" rx="2" fill="#FBE5D6" stroke="#C55A11"/>
<text x="190" y="542" font-size="10.5" fill="#404040">хранилище данных</text>
<rect x="320" y="532" width="14" height="12" rx="2" fill="#E2F0D9" stroke="#548235"/>
<text x="340" y="542" font-size="10.5" fill="#404040">секреты, антиспам</text>
<rect x="470" y="532" width="14" height="12" rx="2" fill="#EDEDED" stroke="#7F7F7F"/>
<text x="490" y="542" font-size="10.5" fill="#404040">внешняя система</text>
</svg>
