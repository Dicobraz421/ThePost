<text x="220.0" y="357" font-size="10.5" text-anchor="middle" fill="#262626">узел Raft</text>
<rect x="460" y="85" width="360" height="54" rx="6" fill="#DCE9F5" stroke="#2E75B6" stroke-width="1.5"/>
<text x="640.0" y="102" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Узлы The Post</text>
<text x="640.0" y="117" font-size="10.5" text-anchor="middle" fill="#262626">каждая роль — минимум один узел</text>
<text x="640.0" y="131" font-size="10.5" text-anchor="middle" fill="#262626">edge и egress-IP — на площадке</text>
<rect x="460" y="175" width="360" height="40" rx="6" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.5"/>
<text x="640.0" y="192" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">PostgreSQL синхронная реплика</text>
<text x="640.0" y="207" font-size="10.5" text-anchor="middle" fill="#262626">+ асинхронная реплика-кандидат</text>
<rect x="460" y="250" width="360" height="54" rx="6" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.5"/>
<text x="640.0" y="267" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">SeaweedFS</text>
<text x="640.0" y="282" font-size="10.5" text-anchor="middle" fill="#262626">volume, master, копия на другой</text>
<text x="640.0" y="296" font-size="10.5" text-anchor="middle" fill="#262626">площадке (replication 100)</text>
<rect x="460" y="325" width="360" height="40" rx="6" fill="#E2F0D9" stroke="#548235" stroke-width="1.5"/>
<text x="640.0" y="342" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">OpenBao</text>
<text x="640.0" y="357" font-size="10.5" text-anchor="middle" fill="#262626">узел Raft</text>
<rect x="872" y="175" width="100" height="40" rx="6" fill="#EDEDED" stroke="#7F7F7F" stroke-width="1.5"/>
<text x="922.0" y="192" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Монитор</text>
<text x="922.0" y="207" font-size="10.5" text-anchor="middle" fill="#262626">СУБД</text>
<rect x="872" y="250" width="100" height="40" rx="6" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.5"/>
<text x="922.0" y="267" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">SeaweedFS</text>
<text x="922.0" y="282" font-size="10.5" text-anchor="middle" fill="#262626">master</text>
<rect x="872" y="325" width="100" height="40" rx="6" fill="#E2F0D9" stroke="#548235" stroke-width="1.5"/>
<text x="922.0" y="342" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">OpenBao</text>
<text x="922.0" y="357" font-size="10.5" text-anchor="middle" fill="#262626">узел Raft</text>
<path d="M400,195 L460,195" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#a)"/>
<text x="430" y="188" font-size="10" text-anchor="middle" fill="#404040" font-style="italic">синхронно</text>
<path d="M400,270 L460,270" fill="none" stroke="#404040" stroke-width="1.5" marker-start="url(#s)" marker-end="url(#a)"/>
<path d="M400,345 L460,345" fill="none" stroke="#404040" stroke-width="1.5" marker-start="url(#s)" marker-end="url(#a)"/>
<rect x="20" y="400" width="965" height="34" rx="6" fill="#EDEDED" stroke="#7F7F7F" stroke-width="1.5"/>
<text x="502.5" y="417" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Общий L4-адрес или DNS на обе площадки; записи MX и SPF — обе площадки</text>
<text x="500" y="465" font-size="11" text-anchor="middle" fill="#404040" font-style="italic">Задержка между A и B ≤ 5 мс; свидетель на C обязателен — без него разрыв связи даёт два primary</text>
<text x="500" y="485" font-size="11" text-anchor="middle" fill="#404040" font-style="italic">Отказ площадки: RPO = 0, переключение СУБД ≤ 30 с, клиенты переподключаются к узлам другой площадки</text>
<rect x="20" y="502" width="14" height="12" rx="2" fill="#DCE9F5" stroke="#2E75B6"/>
<text x="40" y="512" font-size="10.5" fill="#404040">узел The Post</text>
<rect x="170" y="502" width="14" height="12" rx="2" fill="#FBE5D6" stroke="#C55A11"/>
<text x="190" y="512" font-size="10.5" fill="#404040">хранилище данных</text>
<rect x="320" y="502" width="14" height="12" rx="2" fill="#E2F0D9" stroke="#548235"/>
<text x="340" y="512" font-size="10.5" fill="#404040">секреты, антиспам</text>
<rect x="470" y="502" width="14" height="12" rx="2" fill="#EDEDED" stroke="#7F7F7F"/>
<text x="490" y="512" font-size="10.5" fill="#404040">внешняя система</text>
