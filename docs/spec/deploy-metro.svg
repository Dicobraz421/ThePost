<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#404040"/></marker></defs>
<rect width="1000" height="530" fill="#FFFFFF"/>
<text x="500.0" y="26" font-size="16" text-anchor="middle" fill="#1F4E79" font-weight="bold">Метро-кластер: две площадки и свидетель</text>
<rect x="20" y="50" width="400" height="335" rx="8" fill="#F5F9FD" stroke="#1F4E79" stroke-width="1.6"/>
<text x="32" y="70" font-size="13" text-anchor="start" fill="#1F4E79" font-weight="bold">Площадка A</text>
<rect x="440" y="50" width="400" height="335" rx="8" fill="#F5F9FD" stroke="#1F4E79" stroke-width="1.6"/>
<text x="452" y="70" font-size="13" text-anchor="start" fill="#1F4E79" font-weight="bold">Площадка B</text>
<rect x="860" y="50" width="125" height="335" rx="8" fill="#F5F9FD" stroke="#1F4E79" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="872" y="70" font-size="13" text-anchor="start" fill="#1F4E79" font-weight="bold">Площадка C</text>
<rect x="40" y="85" width="360" height="54" rx="6" fill="#DCE9F5" stroke="#2E75B6" stroke-width="1.5"/>
<text x="220.0" y="102" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Узлы The Post</text>
<text x="220.0" y="117" font-size="10.5" text-anchor="middle" fill="#262626">каждая роль — минимум один узел</text>
<text x="220.0" y="131" font-size="10.5" text-anchor="middle" fill="#262626">edge и egress-IP — на площадке</text>
<rect x="40" y="175" width="360" height="40" rx="6" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.5"/>
<text x="220.0" y="192" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">PostgreSQL primary</text>
<text x="220.0" y="207" font-size="10.5" text-anchor="middle" fill="#262626">+ асинхронная реплика-кандидат</text>
<rect x="40" y="250" width="360" height="54" rx="6" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.5"/>
<text x="220.0" y="267" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">SeaweedFS</text>
<text x="220.0" y="282" font-size="10.5" text-anchor="middle" fill="#262626">volume, master, копия на другой</text>
<text x="220.0" y="296" font-size="10.5" text-anchor="middle" fill="#262626">площадке (replication 100)</text>
<rect x="40" y="325" width="360" height="40" rx="6" fill="#E2F0D9" stroke="#548235" stroke-width="1.5"/>
